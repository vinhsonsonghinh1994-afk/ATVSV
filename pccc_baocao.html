<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thư viện tài liệu — Mạng lưới ATVSV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --deep-1:#0b2033; --deep-2:#123d59; --accent:#0e7d8a; --accent-d:#0a6570;
    --accent-soft:#e6f4f5; --ink:#15242f; --muted:#5f707c; --line:#e3eaee;
    --field:#f6f9fa; --danger:#b23b2e; --danger-bg:#fbecea; --danger-d:#8f2c22;
    --ok:#0f7d5a; --ok-bg:#e6f5ef; --page:#eef2f4; --card:#ffffff;
  }
  *{box-sizing:border-box}
  body{
    margin:0; font-family:"Be Vietnam Pro",system-ui,sans-serif; color:var(--ink);
    background:var(--page); -webkit-font-smoothing:antialiased; font-size:14px;
  }

  /* thanh dieu huong */
  .bar{
    background:linear-gradient(120deg,var(--deep-1),var(--deep-2)); color:#fff;
    padding:10px 20px; display:flex; align-items:center; gap:16px;
    position:sticky; top:0; z-index:10; flex-wrap:wrap;
  }
  .bar .mark{width:36px; height:36px; border-radius:9px; background:rgba(255,255,255,.12);
    display:grid; place-items:center; flex:0 0 36px}
  .bar .mark svg{width:22px;height:22px}
  .bar .sys{font-weight:700; font-size:14px; line-height:1.1}
  .bar .sub{font-size:11px; color:#a7c6d4; margin-top:2px}
  .nav{display:flex; gap:4px}
  .nav a{color:#bcd4df; text-decoration:none; font-size:13px; font-weight:600; padding:7px 12px; border-radius:8px}
  .nav a:hover{background:rgba(255,255,255,.1); color:#fff}
  .nav a.active{background:rgba(255,255,255,.15); color:#fff}
  .bar .grow{flex:1}
  .who{text-align:right; line-height:1.2; margin-right:2px}
  .who .n{font-size:13px; font-weight:600}
  .who .r{font-size:11px; color:#a7c6d4; margin-top:2px}
  .btn-out{border:1px solid rgba(255,255,255,.28); background:transparent; color:#fff;
    height:34px; padding:0 13px; border-radius:9px; font:inherit; font-size:13px;
    font-weight:600; cursor:pointer}
  .btn-out:hover{background:rgba(255,255,255,.12)}

  .container{max-width:1160px; margin:0 auto; padding:22px 18px 60px}
  .head{display:flex; align-items:flex-end; gap:12px; flex-wrap:wrap; margin-bottom:18px}
  h1{font-size:22px; font-weight:700; margin:0; letter-spacing:-.01em}
  .count{color:var(--muted); font-size:13px; font-weight:500; padding-bottom:2px}

  .toolbar{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:14px}
  .search{position:relative; flex:1; min-width:200px}
  .search input{width:100%; height:42px; border:1px solid var(--line); background:#fff;
    border-radius:10px; padding:0 14px 0 40px; font:inherit; font-size:14px}
  .search input:focus{outline:none; border-color:var(--accent);
    box-shadow:0 0 0 3px rgba(14,125,138,.14)}
  .search svg{position:absolute; left:13px; top:12px; width:18px; height:18px; stroke:var(--muted)}
  select.filt{height:42px; border:1px solid var(--line); background:#fff; border-radius:10px;
    padding:0 12px; font:inherit; font-size:14px; color:var(--ink); cursor:pointer}
  select.filt:focus{outline:none; border-color:var(--accent)}

  .btn{height:42px; padding:0 16px; border-radius:10px; font:inherit; font-size:14px;
    font-weight:600; cursor:pointer; border:1px solid transparent; display:inline-flex;
    align-items:center; gap:7px; white-space:nowrap}
  .btn svg{width:17px;height:17px}
  .btn-primary{background:var(--accent); color:#fff}
  .btn-primary:hover{background:var(--accent-d)}
  .btn-ghost{background:#fff; color:var(--ink); border-color:var(--line)}
  .btn-ghost:hover{background:var(--field)}
  .btn-danger{background:var(--danger); color:#fff}
  .btn-danger:hover{background:var(--danger-d)}

  /* bang */
  .panel{background:var(--card); border:1px solid var(--line); border-radius:14px; overflow:hidden}
  .scroll{overflow-x:auto}
  table{width:100%; border-collapse:collapse; min-width:820px}
  thead th{background:#f4f8f9; text-align:left; font-size:12px; font-weight:700;
    color:#41525d; text-transform:uppercase; letter-spacing:.03em; padding:12px 14px;
    border-bottom:1px solid var(--line); white-space:nowrap}
  tbody td{padding:12px 14px; border-bottom:1px solid #eef2f4; vertical-align:middle}
  tbody tr:last-child td{border-bottom:none}
  tbody tr:hover{background:#fafcfc}
  td.stt{color:var(--muted); font-variant-numeric:tabular-nums; width:44px}
  td.ten{font-weight:600}
  td.nd{max-width:280px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:#33434e}
  .acts{display:flex; gap:6px; justify-content:flex-end}
  .icon-btn{width:32px; height:32px; border-radius:8px; border:1px solid var(--line);
    background:#fff; cursor:pointer; display:grid; place-items:center}
  .icon-btn svg{width:16px;height:16px}
  .icon-btn:hover{background:var(--field)}
  .icon-btn.del:hover{background:var(--danger-bg); border-color:#f2d2cd}
  .icon-btn.del svg{stroke:var(--danger)}
  .link-btn{display:inline-flex; align-items:center; gap:5px; height:30px; padding:0 12px;
    border-radius:8px; background:var(--accent-soft); color:var(--accent-d); text-decoration:none;
    font-size:12.5px; font-weight:700; white-space:nowrap}
  .link-btn:hover{background:#d8eef0}
  .link-off{color:var(--muted); font-size:12.5px}

  .state{padding:48px 20px; text-align:center; color:var(--muted)}
  .state .big{font-size:15px; font-weight:600; color:#41525d; margin-bottom:4px}
  .spin{width:22px;height:22px;border:2.5px solid var(--line);border-top-color:var(--accent);
    border-radius:50%;animation:sp .7s linear infinite;margin:0 auto 12px}
  @keyframes sp{to{transform:rotate(360deg)}}

  /* modal */
  .overlay{position:fixed; inset:0; background:rgba(9,24,36,.55); display:none;
    align-items:flex-start; justify-content:center; padding:28px 16px; z-index:50; overflow-y:auto}
  .overlay.show{display:flex}
  .modal{background:#fff; border-radius:16px; width:100%; max-width:560px; margin:auto;
    box-shadow:0 24px 60px -20px rgba(3,20,33,.5)}
  .modal-h{padding:18px 22px; border-bottom:1px solid var(--line); display:flex;
    align-items:center; justify-content:space-between}
  .modal-h h3{margin:0; font-size:17px; font-weight:700}
  .x{width:32px;height:32px;border:none;background:var(--field);border-radius:8px;cursor:pointer;
    font-size:17px;color:var(--muted);line-height:1}
  .x:hover{background:#e7edf0}
  .modal-b{padding:20px 22px}
  .grid{display:grid; grid-template-columns:1fr 1fr; gap:14px}
  .fld{display:flex; flex-direction:column}
  .fld.full{grid-column:1/-1}
  .fld label{font-size:12.5px; font-weight:600; margin-bottom:6px; color:#2b3a45}
  .fld label .req{color:var(--danger)}
  .fld input, .fld select, .fld textarea{height:42px; border:1px solid var(--line);
    background:var(--field); border-radius:10px; padding:0 12px; font:inherit; font-size:14px; color:var(--ink)}
  .fld textarea{height:auto; min-height:64px; padding:10px 12px; resize:vertical}
  .fld input:focus, .fld select:focus, .fld textarea:focus{outline:none;
    border-color:var(--accent); background:#fff; box-shadow:0 0 0 3px rgba(14,125,138,.14)}
  .hint{font-size:11.5px; color:var(--muted); margin-top:5px}
  .lock{height:42px; display:flex; align-items:center; padding:0 12px; border-radius:10px;
    background:#eef2f4; color:#41525d; font-weight:600; font-size:14px}
  .modal-err{display:none; background:var(--danger-bg); color:var(--danger); font-size:13px;
    border:1px solid #f2d2cd; border-radius:10px; padding:10px 12px; margin-top:4px}
  .modal-err.show{display:block}
  .modal-f{padding:16px 22px; border-top:1px solid var(--line); display:flex;
    justify-content:flex-end; gap:10px}

  /* confirm xoa */
  .confirm{max-width:400px; text-align:center}
  .confirm .modal-b{padding:26px 22px 10px}
  .confirm .warn{width:52px;height:52px;border-radius:50%;background:var(--danger-bg);
    display:grid;place-items:center;margin:0 auto 14px}
  .confirm .warn svg{width:26px;height:26px;stroke:var(--danger)}
  .confirm h3{margin:0 0 6px;font-size:17px}
  .confirm p{margin:0;color:var(--muted);font-size:13.5px;line-height:1.5}

  @media (max-width:640px){
    .grid{grid-template-columns:1fr}
    .who .r{display:none}
    h1{font-size:20px}
    .btn span.lbl{display:none}
    .btn{padding:0 13px}
    .bar .sub{display:none}
    td.nd{max-width:160px}
  }
</style>
</head>
<body>
<div class="container">
  <div class="head">
    <h1 id="tieuDeTrang">Thư viện tài liệu</h1>
    <span class="count" id="soLuong"></span>
  </div>

  <div class="toolbar">
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3" stroke-linecap="round"/></svg>
      <input id="oTimKiem" placeholder="Tìm theo tiêu đề, mô tả, người tải…">
    </div>
    <select class="filt" id="locDonVi">
      <option value="">Tất cả đơn vị</option>
      <option value="VS">Vĩnh Sơn</option>
      <option value="SH">Sông Hinh</option>
      <option value="TKT">Thượng Kon Tum</option><option value="TT_DVTV">TT DVTV</option>
    </select>
    <button class="btn btn-primary" id="nutThem">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      <span class="lbl">Thêm tài liệu</span>
    </button>
  </div>

  <div class="panel">
    <div id="trangThai" class="state"><div class="spin"></div>Đang tải dữ liệu…</div>
    <div class="scroll" id="khungBang" style="display:none">
      <table>
        <thead><tr id="hangTieuDe"></tr></thead>
        <tbody id="thanBang"></tbody>
      </table>
    </div>
  </div>
</div>

<!-- MODAL THEM/SUA -->
<div class="overlay" id="modalForm">
  <div class="modal">
    <div class="modal-h">
      <h3 id="tieuDeForm">Thêm tài liệu</h3>
      <button class="x" data-dong>×</button>
    </div>
    <div class="modal-b">
      <div class="grid">
        <div class="fld full">
          <label>Tiêu đề <span class="req">*</span></label>
          <input id="f_tieu_de" placeholder="Ví dụ: Bản tin an toàn điện tháng 8/2026">
        </div>
        <div class="fld full">
          <label>Mô tả</label>
          <textarea id="f_mo_ta" placeholder="Mô tả ngắn về nội dung tài liệu (nếu có)"></textarea>
        </div>
        <div class="fld full">
          <label>Link Google Drive <span class="req">*</span></label>
          <input id="f_link_file" placeholder="https://drive.google.com/...">
          <div class="hint">Dán link chia sẻ từ Google Drive (bắt đầu bằng http:// hoặc https://). Nhớ bật chia sẻ "Bất kỳ ai có link" trước khi dán.</div>
        </div>
        <div class="fld">
          <label>Đơn vị <span class="req">*</span></label>
          <select id="f_don_vi">
            <option value="VS">Vĩnh Sơn</option>
            <option value="SH">Sông Hinh</option>
            <option value="TKT">Thượng Kon Tum</option><option value="TT_DVTV">TT DVTV</option>
          </select>
        </div>
        <div class="fld">
          <label>Người tải</label>
          <input id="f_nguoi_tai" placeholder="Họ tên (không bắt buộc)">
        </div>
      </div>
      <div class="modal-err" id="loiForm"></div>
    </div>
    <div class="modal-f">
      <button class="btn btn-ghost" data-dong>Hủy</button>
      <button class="btn btn-primary" id="nutLuu">Lưu</button>
    </div>
  </div>
</div>

<!-- CONFIRM XOA -->
<div class="overlay" id="modalXoa">
  <div class="modal confirm">
    <div class="modal-b">
      <div class="warn"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4m0 4h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/></svg></div>
      <h3>Xóa tài liệu</h3>
      <p id="xoaNoiDung">Bạn có chắc muốn xóa?</p>
    </div>
    <div class="modal-f" style="justify-content:center">
      <button class="btn btn-ghost" data-dong-xoa>Hủy</button>
      <button class="btn btn-danger" id="nutXacNhanXoa">Xóa</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* =========================================================================
   NHÂN BẢN TRANG CHO DANH MỤC KHÁC:
   chỉ cần đổi 2 hằng số dưới đây (và lưu file với tên khác), phần còn lại
   của trang tự chạy theo danh mục mới.
   ========================================================================= */
const DANH_MUC       = 'pccc_bao_cao';
const TIEU_DE_TRANG  = 'Báo cáo định kỳ PCCC';
/* ========================================================================= */

/* ===== CẤU HÌNH (giống các trang khác) ===== */
const SUPABASE_URL = 'https://lasbxdhexxczzfrfkexn.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imxhc2J4ZGhleHhjenpmcmZrZXhuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAyOTAwMzcsImV4cCI6MjA5NTg2NjAzN30.YQD7CPkdG7kGz6qxUF4JJPz_Eb0IKsyq0KNcZ2lAtoA';
/* ============================================ */

document.title = TIEU_DE_TRANG + ' — Mạng lưới ATVSV';
document.getElementById('tieuDeTrang').textContent = TIEU_DE_TRANG;

const TEN_DON_VI = { VS:'Vĩnh Sơn', SH:'Sông Hinh', TKT:'Thượng Kon Tum', TT_DVTV:'TT DVTV' };

let sb = null;
if (window.supabase && SUPABASE_ANON_KEY.startsWith('eyJ'))
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const $ = id => document.getElementById(id);
let danhSachGoc = [];
let dangSua = null;         // id dang sua, null = them moi

function esc(s){ return (s??'').toString().replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function fmtNgayGio(iso){
  if(!iso) return '—';
  const d = new Date(iso);
  if (isNaN(d)) return '—';
  const dd=String(d.getDate()).padStart(2,'0'), mm=String(d.getMonth()+1).padStart(2,'0');
  const hh=String(d.getHours()).padStart(2,'0'), mi=String(d.getMinutes()).padStart(2,'0');
  return `${dd}/${mm}/${d.getFullYear()} ${hh}:${mi}`;
}
function linkHopLe(u){ return typeof u==='string' && /^https?:\/\//i.test(u.trim()) ? u.trim() : null; }

/* ---------- KHỞI TẠO ---------- */
async function khoiTao(){
  const cols = ['STT','Tiêu đề','Mô tả','Đơn vị','Người tải','Ngày tải','Tài liệu',''];
  $('hangTieuDe').innerHTML = cols.map(c=>`<th>${c}</th>`).join('');
  await napDanhSach();
}

async function napDanhSach(){
  const r = await sb.from('tai_lieu').select('*')
    .eq('danh_muc', DANH_MUC).order('ngay_tai', {ascending:false});
  if (r.error){
    $('trangThai').innerHTML = 'Không tải được danh sách. Thử tải lại trang.';
    return;
  }
  danhSachGoc = r.data || [];
  loc();
}

/* ---------- LỌC & VẼ BẢNG ---------- */
function loc(){
  const tu = $('oTimKiem').value.trim().toLowerCase();
  const dv = $('locDonVi').value;
  let ds = danhSachGoc.filter(x=>{
    if (dv && x.don_vi !== dv) return false;
    if (!tu) return true;
    return [x.tieu_de,x.mo_ta,x.nguoi_tai].some(v=>(v||'').toLowerCase().includes(tu));
  });
  veBang(ds);
}

function veBang(ds){
  $('soLuong').textContent = danhSachGoc.length ? `${ds.length} tài liệu` : '';
  $('trangThai').style.display = 'none';
  $('khungBang').style.display = '';

  if (!ds.length){
    $('khungBang').style.display = 'none';
    $('trangThai').style.display = '';
    $('trangThai').innerHTML = danhSachGoc.length
      ? '<div class="big">Không tìm thấy</div>Không có tài liệu nào khớp bộ lọc.'
      : '<div class="big">Chưa có tài liệu</div>Bấm “Thêm tài liệu” để đăng tài liệu đầu tiên.';
    return;
  }

  $('thanBang').innerHTML = ds.map((x,i)=>{
    const href = linkHopLe(x.link_file);
    let h = `<tr>`;
    h += `<td class="stt">${i+1}</td>`;
    h += `<td class="ten">${esc(x.tieu_de)}</td>`;
    h += `<td class="nd" title="${esc(x.mo_ta)}">${esc(x.mo_ta)||'—'}</td>`;
    h += `<td>${TEN_DON_VI[x.don_vi]||esc(x.don_vi)}</td>`;
    h += `<td>${esc(x.nguoi_tai)||'—'}</td>`;
    h += `<td>${fmtNgayGio(x.ngay_tai)}</td>`;
    h += `<td>${href
      ? `<a class="link-btn" href="${esc(href)}" target="_blank" rel="noopener noreferrer">Mở/Tải</a>`
      : '<span class="link-off">Link không hợp lệ</span>'}</td>`;
    h += `<td><div class="acts">`;
    h += `<button class="icon-btn" data-sua="${x.id}" title="Sửa"><svg viewBox="0 0 24 24" fill="none" stroke="#41525d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button>`;
    h += `<button class="icon-btn del" data-xoa="${x.id}" title="Xóa"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2m1 0-1 14a1 1 0 0 1-1 1H8a1 1 0 0 1-1-1L6 6"/></svg></button>`;
    h += `</div></td>`;
    return h + `</tr>`;
  }).join('');

  $('thanBang').querySelectorAll('[data-sua]').forEach(b=>b.onclick=()=>moForm(b.dataset.sua));
  $('thanBang').querySelectorAll('[data-xoa]').forEach(b=>b.onclick=()=>hoiXoa(b.dataset.xoa));
}

/* ---------- FORM THÊM / SỬA ---------- */
function moForm(id){
  dangSua = id || null;
  $('loiForm').classList.remove('show');
  $('tieuDeForm').textContent = id ? 'Sửa tài liệu' : 'Thêm tài liệu';
  const x = id ? danhSachGoc.find(r=>r.id===id) : {};
  $('f_tieu_de').value = x.tieu_de || '';
  $('f_mo_ta').value = x.mo_ta || '';
  $('f_link_file').value = x.link_file || '';
  $('f_don_vi').value = x.don_vi || 'VS';
  $('f_nguoi_tai').value = x.nguoi_tai || '';
  $('modalForm').classList.add('show');
  $('f_tieu_de').focus();
}
function dongForm(){ $('modalForm').classList.remove('show'); }

async function luu(){
  const tieuDe = $('f_tieu_de').value.trim();
  const link = $('f_link_file').value.trim();
  if (!tieuDe){ baoLoiForm('Vui lòng nhập tiêu đề tài liệu.'); return; }
  if (!/^https?:\/\//i.test(link)){ baoLoiForm('Link tài liệu phải bắt đầu bằng http:// hoặc https:// (dán link chia sẻ từ Google Drive).'); return; }

  const ban = {
    tieu_de: tieuDe,
    mo_ta: $('f_mo_ta').value.trim() || null,
    link_file: link,
    don_vi: $('f_don_vi').value,
    nguoi_tai: $('f_nguoi_tai').value.trim() || null,
  };
  if (!dangSua){
    ban.danh_muc = DANH_MUC;
  }

  $('nutLuu').disabled = true; $('nutLuu').textContent = 'Đang lưu…';
  let err;
  if (dangSua){
    ({ error:err } = await sb.from('tai_lieu').update(ban).eq('id', dangSua));
  } else {
    ({ error:err } = await sb.from('tai_lieu').insert(ban));
  }
  $('nutLuu').disabled = false; $('nutLuu').textContent = 'Lưu';

  if (err){
    baoLoiForm('Không lưu được: ' + err.message);
    return;
  }
  dongForm();
  await napDanhSach();
}
function baoLoiForm(m){ const e=$('loiForm'); e.textContent=m; e.classList.add('show'); }

/* ---------- XÓA ---------- */
let idXoa = null;
function hoiXoa(id){
  idXoa = id;
  const x = danhSachGoc.find(r=>r.id===id);
  $('xoaNoiDung').innerHTML = `Xóa tài liệu <b>${esc(x.tieu_de)}</b>? Thao tác này không thể hoàn tác.`;
  $('modalXoa').classList.add('show');
}
async function xacNhanXoa(){
  if (!idXoa) return;
  $('nutXacNhanXoa').disabled = true; $('nutXacNhanXoa').textContent = 'Đang xóa…';
  const { error } = await sb.from('tai_lieu').delete().eq('id', idXoa);
  $('nutXacNhanXoa').disabled = false; $('nutXacNhanXoa').textContent = 'Xóa';
  $('modalXoa').classList.remove('show');
  if (error){
    alert('Không xóa được: ' + error.message);
    return;
  }
  idXoa = null;
  await napDanhSach();
}

/* ---------- SỰ KIỆN ---------- */
$('nutThem').onclick = ()=>moForm(null);
$('nutLuu').onclick = luu;
$('nutXacNhanXoa').onclick = xacNhanXoa;
$('oTimKiem').oninput = loc;
$('locDonVi').onchange = loc;
document.querySelectorAll('[data-dong]').forEach(b=>b.onclick=dongForm);
document.querySelectorAll('[data-dong-xoa]').forEach(b=>b.onclick=()=>$('modalXoa').classList.remove('show'));
[$('modalForm'),$('modalXoa')].forEach(o=>o.onclick=e=>{ if(e.target===o) o.classList.remove('show'); });

khoiTao();
</script>
</body>
