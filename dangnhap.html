<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đăng nhập — Mạng lưới ATVSV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --deep-1:#0b2033; --deep-2:#123d59; --accent:#0e7d8a; --accent-d:#0a6570;
    --accent-soft:#e6f4f5; --ink:#15242f; --muted:#5f707c; --line:#e3eaee;
    --field:#f6f9fa; --danger:#b23b2e; --danger-bg:#fbecea; --ok:#0f7d5a; --ok-bg:#e6f5ef;
    --card:#ffffff;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; font-family:"Be Vietnam Pro",system-ui,sans-serif; color:var(--ink);
    background:
      radial-gradient(1200px 600px at 15% -10%, #1a5578 0%, transparent 55%),
      radial-gradient(1000px 700px at 110% 120%, #0e6470 0%, transparent 50%),
      linear-gradient(160deg, var(--deep-1), var(--deep-2));
    display:flex; align-items:center; justify-content:center;
    padding:24px; -webkit-font-smoothing:antialiased;
  }
  .wrap{width:100%; max-width:420px}
  .card{
    background:var(--card); border-radius:18px; padding:32px 30px 30px;
    box-shadow:0 20px 50px -18px rgba(3,20,33,.55), 0 2px 6px rgba(3,20,33,.12);
    position:relative; overflow:hidden;
  }
  .card::before{
    content:""; position:absolute; inset:0 0 auto 0; height:4px;
    background:linear-gradient(90deg, var(--accent), #34b0b8 55%, var(--accent));
  }
  .brand{display:flex; align-items:center; gap:12px; margin-bottom:26px}
  .mark{width:44px; height:44px; border-radius:12px; flex:0 0 44px; background:var(--accent-soft); display:grid; place-items:center}
  .mark svg{width:26px; height:26px; display:block}
  .sys{font-size:15px; font-weight:700; line-height:1.2}
  .org{font-size:11.5px; color:var(--muted); font-weight:500; margin-top:3px; line-height:1.3}
  h1{font-size:25px; font-weight:700; margin:0 0 4px; letter-spacing:-.02em}
  .lead{font-size:13.5px; color:var(--muted); margin:0 0 22px}
  label{display:block; font-size:13px; font-weight:600; margin:0 0 7px; color:#2b3a45}
  .field, select.field{
    width:100%; height:46px; border:1px solid var(--line); background:var(--field);
    border-radius:11px; padding:0 14px; font:inherit; font-size:15px; color:var(--ink);
    transition:border-color .15s, background .15s, box-shadow .15s;
  }
  .field::placeholder{color:#9aa8b1}
  .field:focus{outline:none; border-color:var(--accent); background:#fff; box-shadow:0 0 0 3px rgba(14,125,138,.16)}
  .row{margin-bottom:16px}
  .pw{position:relative}
  .pw .field{padding-right:58px}
  .toggle{
    position:absolute; right:6px; top:6px; height:34px; padding:0 12px; border:none;
    background:transparent; color:var(--accent-d); font:inherit; font-size:13px;
    font-weight:600; cursor:pointer; border-radius:8px;
  }
  .toggle:hover{background:var(--accent-soft)}
  .err{
    display:none; background:var(--danger-bg); color:var(--danger);
    font-size:13px; line-height:1.45; border-radius:10px; padding:11px 13px; margin-bottom:16px;
    border:1px solid #f2d2cd;
  }
  .err.show{display:block}
  .ok{
    display:none; background:var(--ok-bg); color:var(--ok);
    font-size:13px; line-height:1.45; border-radius:10px; padding:11px 13px; margin-bottom:16px;
    border:1px solid #cdeadd;
  }
  .ok.show{display:block}
  .cta{
    width:100%; height:48px; border:none; border-radius:11px; cursor:pointer;
    background:var(--accent); color:#fff; font:inherit; font-size:15px; font-weight:600;
    display:inline-flex; align-items:center; justify-content:center; gap:9px;
    transition:background .15s, transform .05s;
  }
  .cta:hover{background:var(--accent-d)}
  .cta:active{transform:translateY(1px)}
  .cta[disabled]{opacity:.7; cursor:default}
  .spin{
    width:16px; height:16px; border:2px solid rgba(255,255,255,.45);
    border-top-color:#fff; border-radius:50%; animation:sp .7s linear infinite; display:none;
  }
  .cta.loading .spin{display:block}
  @keyframes sp{to{transform:rotate(360deg)}}
  .foot{text-align:center; color:#a7c0cf; font-size:11.5px; margin:18px 4px 0; line-height:1.5}

  .done{text-align:center; padding:6px 2px 2px}
  .check{width:56px; height:56px; border-radius:50%; background:var(--accent-soft); display:grid; place-items:center; margin:2px auto 16px}
  .check svg{width:30px; height:30px}
  .done h2{font-size:20px; margin:0 0 3px; font-weight:700}
  .done .name{font-size:15px; color:var(--muted); margin:0 0 18px}
  .tags{display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin-bottom:22px}
  .tag{font-size:12.5px; font-weight:600; padding:6px 12px; border-radius:999px; background:var(--field); border:1px solid var(--line); color:#2b3a45}
  .tag b{color:var(--accent-d)}
  .signout, .link-btn{
    width:100%; height:44px; margin-top:10px; border:1px solid var(--line);
    background:#fff; border-radius:11px; font:inherit; font-size:14px; font-weight:600;
    color:var(--muted); cursor:pointer;
  }
  .signout:hover, .link-btn:hover{background:var(--field); color:var(--ink)}
  .hidden{display:none !important}

  /* doi mat khau */
  .mk-form{text-align:left; margin-top:6px}

  @media (max-width:440px){
    body{padding:14px}
    .card{padding:26px 20px 24px; border-radius:16px}
    h1{font-size:23px}
  }
</style>
</head>
<body>
<main class="wrap">
  <div class="card">
    <div class="brand">
      <div class="mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none">
          <path d="M12 2.5C12 2.5 5.5 9.5 5.5 14.2a6.5 6.5 0 0 0 13 0C18.5 9.5 12 2.5 12 2.5Z" fill="#0e7d8a"/>
          <path d="M8 14.6c1.2 0 1.2 1.1 2.4 1.1s1.2-1.1 2.4-1.1 1.2 1.1 2.4 1.1" stroke="#fff" stroke-width="1.4" stroke-linecap="round" fill="none"/>
        </svg>
      </div>
      <div class="brand-text">
        <div class="sys">Mạng lưới ATVSV</div>
        <div class="org">Công ty CP Thủy điện Vĩnh Sơn - Sông Hinh</div>
      </div>
    </div>

    <!-- FORM DANG NHAP -->
    <div id="khoiDangNhap">
      <h1>Đăng nhập</h1>
      <p class="lead">Dùng họ tên và mật khẩu được cấp để vào hệ thống.</p>

      <div class="row">
        <label for="hoTen">Họ và tên</label>
        <select id="hoTen" class="field"><option value="">— Đang tải danh sách —</option></select>
      </div>

      <div class="row">
        <label for="matkhau">Mật khẩu</label>
        <div class="pw">
          <input id="matkhau" class="field" type="password" autocomplete="current-password" placeholder="Nhập mật khẩu">
          <button type="button" class="toggle" id="nutHien">Hiện</button>
        </div>
      </div>

      <div class="err" id="loi" role="alert" aria-live="assertive"></div>

      <button class="cta" id="nutDangNhap">
        <span class="spin" aria-hidden="true"></span>
        <span id="nhanNut">Đăng nhập</span>
      </button>
    </div>

    <!-- PANEL DA DANG NHAP -->
    <div id="khoiXong" class="done hidden">
      <div class="check" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none">
          <path d="M5 12.5l4.5 4.5L19 7.5" stroke="#0e7d8a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <h2>Đăng nhập thành công</h2>
      <p class="name" id="tenNguoiDung"></p>
      <div class="tags">
        <span class="tag" id="tagDonVi" style="display:none">Đơn vị: <b id="tenDonVi"></b></span>
        <span class="tag">Vai trò: <b id="tenVaiTro"></b></span>
      </div>
      <button class="link-btn" id="nutDoiMK">Đổi mật khẩu</button>
      <button class="signout" id="nutDangXuat">Đăng xuất</button>

      <div class="mk-form hidden" id="khoiDoiMK">
        <div class="row" style="margin-top:16px">
          <label>Mật khẩu hiện tại</label>
          <input id="mk_hien_tai" type="password" class="field">
        </div>
        <div class="row">
          <label>Mật khẩu mới</label>
          <input id="mk_moi" type="password" class="field">
        </div>
        <div class="row">
          <label>Nhập lại mật khẩu mới</label>
          <input id="mk_moi_2" type="password" class="field">
        </div>
        <div class="err" id="loiMK"></div>
        <div class="ok" id="okMK">Đổi mật khẩu thành công!</div>
        <button class="cta" id="nutXacNhanMK">Xác nhận đổi mật khẩu</button>
      </div>
    </div>
  </div>

  <p class="foot">Hệ thống quản lý An toàn vệ sinh viên · Nội bộ Công ty</p>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* =========================================================
   CẤU HÌNH
   ========================================================= */
const SUPABASE_URL = 'https://lasbxdhexxczzfrfkexn.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imxhc2J4ZGhleHhjenpmcmZrZXhuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAyOTAwMzcsImV4cCI6MjA5NTg2NjAzN30.YQD7CPkdG7kGz6qxUF4JJPz_Eb0IKsyq0KNcZ2lAtoA';
/* ========================================================= */

const TEN_DON_VI = { VS:'Vĩnh Sơn', SH:'Sông Hinh', TKT:'Thượng Kon Tum', TT_DVTV:'TT DVTV' };
const TEN_VAI_TRO = {
  quan_tri:'Quản trị viên', ky_su_an_toan:'Kỹ sư an toàn',
  phu_trach_nha_may:'Phụ trách nhà máy', atvsv:'An toàn vệ sinh viên'
};
const KHOA_PHIEN = 'phien_dangnhap';

let sb = null;
if (window.supabase && SUPABASE_ANON_KEY.startsWith('eyJ')) {
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
}

const $ = id => document.getElementById(id);
const elMk = $('matkhau'), elLoi = $('loi');
const elNut = $('nutDangNhap'), elNhan = $('nhanNut');
let dsNguoiDung = []; // {value:'nhan_su:<id>'|'atvsv:<id>', ho_ten, vai_tro, don_vi}

function baoLoi(msg){ elLoi.textContent = msg; elLoi.classList.add('show'); }
function xoaLoi(){ elLoi.textContent = ''; elLoi.classList.remove('show'); }
function dangTai(bat){
  elNut.disabled = bat;
  elNut.classList.toggle('loading', bat);
  elNhan.textContent = bat ? 'Đang đăng nhập…' : 'Đăng nhập';
}

$('nutHien').addEventListener('click', () => {
  const hien = elMk.type === 'password';
  elMk.type = hien ? 'text' : 'password';
  $('nutHien').textContent = hien ? 'Ẩn' : 'Hiện';
  elMk.focus();
});

async function napDanhSachDangNhap(){
  const [ns, av] = await Promise.all([
    sb.from('nhan_su').select('id,ho_ten,vai_tro,don_vi').eq('dang_hoat_dong', true).order('ho_ten'),
    sb.from('atvsv').select('id,ho_ten,don_vi').order('ho_ten'),
  ]);
  dsNguoiDung = [];
  (ns.data||[]).forEach(x => dsNguoiDung.push({ value:'nhan_su:'+x.id, ho_ten:x.ho_ten, vai_tro:x.vai_tro, don_vi:x.don_vi }));
  (av.data||[]).forEach(x => dsNguoiDung.push({ value:'atvsv:'+x.id, ho_ten:x.ho_ten, vai_tro:'atvsv', don_vi:x.don_vi }));
  dsNguoiDung.sort((a,b)=>a.ho_ten.localeCompare(b.ho_ten,'vi'));
  $('hoTen').innerHTML = '<option value="">— Chọn tên của bạn —</option>' +
    dsNguoiDung.map(x=>`<option value="${x.value}">${esc(x.ho_ten)} (${esc(TEN_VAI_TRO[x.vai_tro]||x.vai_tro)})</option>`).join('');
}
function esc(s){ return (s??'').toString().replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

async function xuLyDangNhap(){
  xoaLoi();
  const val = $('hoTen').value;
  const matKhau = elMk.value;
  if (!val){ baoLoi('Vui lòng chọn họ tên của bạn.'); return; }
  if (!matKhau){ baoLoi('Vui lòng nhập mật khẩu.'); return; }
  if (!sb){ baoLoi('Chưa cấu hình kết nối.'); return; }

  const [loai, id] = val.split(':');
  const bang = loai;
  const cot = loai === 'nhan_su' ? 'id,ho_ten,vai_tro,don_vi' : 'id,ho_ten,don_vi';

  dangTai(true);
  let kq;
  try{
    kq = await sb.from(bang).select(cot).eq('id', id).eq('mat_khau', matKhau).maybeSingle();
  }catch(e){
    dangTai(false);
    baoLoi('Không kết nối được máy chủ. Kiểm tra mạng rồi thử lại.');
    return;
  }
  dangTai(false);

  if (kq.error || !kq.data){
    baoLoi('Họ tên hoặc mật khẩu không đúng, hoặc tài khoản chưa được cấp mật khẩu — liên hệ quản trị viên.');
    return;
  }
  const hoSo = {
    loai, id: kq.data.id, ho_ten: kq.data.ho_ten,
    vai_tro: loai === 'nhan_su' ? kq.data.vai_tro : 'atvsv',
    don_vi: kq.data.don_vi || null,
  };
  luuPhien(hoSo);
  hienThiXong(hoSo);
}

function luuPhien(hoSo){ sessionStorage.setItem(KHOA_PHIEN, JSON.stringify(hoSo)); }
function layPhien(){ try{ return JSON.parse(sessionStorage.getItem(KHOA_PHIEN)); }catch(e){ return null; } }
function xoaPhien(){ sessionStorage.removeItem(KHOA_PHIEN); }

function hienThiXong(hoSo){
  $('tenNguoiDung').textContent = hoSo.ho_ten;
  if (hoSo.don_vi){ $('tenDonVi').textContent = TEN_DON_VI[hoSo.don_vi]||hoSo.don_vi; $('tagDonVi').style.display=''; }
  else { $('tagDonVi').style.display='none'; }
  $('tenVaiTro').textContent = TEN_VAI_TRO[hoSo.vai_tro] || hoSo.vai_tro;
  $('khoiDangNhap').classList.add('hidden');
  $('khoiXong').classList.remove('hidden');
  $('khoiDoiMK').classList.add('hidden');
}

function dangXuatManHinh(){
  $('khoiXong').classList.add('hidden');
  $('khoiDangNhap').classList.remove('hidden');
  $('hoTen').value=''; elMk.value=''; xoaLoi();
}

$('nutDangXuat').addEventListener('click', () => { xoaPhien(); dangXuatManHinh(); });
$('nutDoiMK').addEventListener('click', () => {
  $('khoiDoiMK').classList.toggle('hidden');
  $('mk_hien_tai').value=''; $('mk_moi').value=''; $('mk_moi_2').value='';
  $('loiMK').classList.remove('show'); $('okMK').classList.remove('show');
});
$('nutXacNhanMK').addEventListener('click', async () => {
  const phien = layPhien();
  if (!phien) return;
  const hienTai=$('mk_hien_tai').value, moi=$('mk_moi').value, moi2=$('mk_moi_2').value;
  $('loiMK').classList.remove('show'); $('okMK').classList.remove('show');
  if (!hienTai||!moi||!moi2){ $('loiMK').textContent='Vui lòng điền đủ các ô.'; $('loiMK').classList.add('show'); return; }
  if (moi.length<4){ $('loiMK').textContent='Mật khẩu mới phải có ít nhất 4 ký tự.'; $('loiMK').classList.add('show'); return; }
  if (moi!==moi2){ $('loiMK').textContent='Mật khẩu mới nhập lại không khớp.'; $('loiMK').classList.add('show'); return; }

  $('nutXacNhanMK').disabled = true;
  const bang = phien.loai;
  const kt = await sb.from(bang).select('id').eq('id', phien.id).eq('mat_khau', hienTai).maybeSingle();
  if (kt.error || !kt.data){
    $('nutXacNhanMK').disabled = false;
    $('loiMK').textContent='Mật khẩu hiện tại không đúng.'; $('loiMK').classList.add('show');
    return;
  }
  const { error } = await sb.from(bang).update({ mat_khau: moi }).eq('id', phien.id);
  $('nutXacNhanMK').disabled = false;
  if (error){ $('loiMK').textContent='Không đổi được mật khẩu: '+error.message; $('loiMK').classList.add('show'); return; }
  $('okMK').classList.add('show');
  $('mk_hien_tai').value=''; $('mk_moi').value=''; $('mk_moi_2').value='';
});

elNut.addEventListener('click', xuLyDangNhap);
elMk.addEventListener('keydown', e => { if (e.key === 'Enter') xuLyDangNhap(); });

// Goi tu trang index.html moi khi chuyen vao tab nay, de nhan dien viec
// dang xuat/dang nhap xay ra o cac tab khac trong luc trang nay da tai san.
window.lamMoiKhiHienThi = function(){
  const phien = layPhien();
  if (phien) hienThiXong(phien); else dangXuatManHinh();
};

(async () => {
  if (!sb) return;
  await napDanhSachDangNhap();
  const phien = layPhien();
  if (phien) hienThiXong(phien);
})();
</script>
</body>
</html>
