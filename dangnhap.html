<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đăng nhập — Mạng lưới ATVSV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --deep-1:#0b2033; --deep-2:#123d59; --accent:#0e7d8a; --accent-d:#0a6570;
    --accent-soft:#e6f4f5; --ink:#15242f; --muted:#5f707c; --line:#e3eaee;
    --field:#f6f9fa; --danger:#b23b2e; --danger-bg:#fbecea; --ok:#0f7d5a;
    --card:#ffffff;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; font-family:"Be Vietnam Pro",system-ui,sans-serif; color:var(--ink);
    background:
      radial-gradient(1200px 600px at 15% -10%, #1a5578 0%, transparent 55%),
      radial-gradient(1000px 700px at 110% 120%, #0e6470 0%, transparent 50%),
      linear-gradient(160deg, var(--deep-1), var(--deep-2));
    display:flex; align-items:center; justify-content:center;
    padding:24px; -webkit-font-smoothing:antialiased;
  }
  .wrap{width:100%; max-width:412px}
  .card{
    background:var(--card); border-radius:18px; padding:32px 30px 30px;
    box-shadow:0 20px 50px -18px rgba(3,20,33,.55), 0 2px 6px rgba(3,20,33,.12);
    position:relative; overflow:hidden;
  }
  .card::before{ /* thanh nuoc chay o dinh the */
    content:""; position:absolute; inset:0 0 auto 0; height:4px;
    background:linear-gradient(90deg, var(--accent), #34b0b8 55%, var(--accent));
  }
  .brand{display:flex; align-items:center; gap:12px; margin-bottom:26px}
  .mark{
    width:44px; height:44px; border-radius:12px; flex:0 0 44px;
    background:var(--accent-soft); display:grid; place-items:center;
  }
  .mark svg{width:26px; height:26px; display:block}
  .sys{font-size:15px; font-weight:700; line-height:1.2}
  .org{font-size:11.5px; color:var(--muted); font-weight:500; margin-top:3px; line-height:1.3}
  h1{font-size:25px; font-weight:700; margin:0 0 4px; letter-spacing:-.02em}
  .lead{font-size:13.5px; color:var(--muted); margin:0 0 22px}
  label{display:block; font-size:13px; font-weight:600; margin:0 0 7px; color:#2b3a45}
  .field{
    width:100%; height:46px; border:1px solid var(--line); background:var(--field);
    border-radius:11px; padding:0 14px; font:inherit; font-size:15px; color:var(--ink);
    transition:border-color .15s, background .15s, box-shadow .15s;
  }
  .field::placeholder{color:#9aa8b1}
  .field:focus{outline:none; border-color:var(--accent); background:#fff;
    box-shadow:0 0 0 3px rgba(14,125,138,.16)}
  .row{margin-bottom:16px}
  .pw{position:relative}
  .pw .field{padding-right:58px}
  .toggle{
    position:absolute; right:6px; top:6px; height:34px; padding:0 12px; border:none;
    background:transparent; color:var(--accent-d); font:inherit; font-size:13px;
    font-weight:600; cursor:pointer; border-radius:8px;
  }
  .toggle:hover{background:var(--accent-soft)}
  .toggle:focus-visible{outline:2px solid var(--accent); outline-offset:1px}
  .err{
    display:none; background:var(--danger-bg); color:var(--danger);
    font-size:13px; line-height:1.45; border-radius:10px; padding:11px 13px; margin-bottom:16px;
    border:1px solid #f2d2cd;
  }
  .err.show{display:block}
  .cta{
    width:100%; height:48px; border:none; border-radius:11px; cursor:pointer;
    background:var(--accent); color:#fff; font:inherit; font-size:15px; font-weight:600;
    display:inline-flex; align-items:center; justify-content:center; gap:9px;
    transition:background .15s, transform .05s;
  }
  .cta:hover{background:var(--accent-d)}
  .cta:active{transform:translateY(1px)}
  .cta:focus-visible{outline:2px solid #0a4a52; outline-offset:2px}
  .cta[disabled]{opacity:.7; cursor:default}
  .spin{
    width:16px; height:16px; border:2px solid rgba(255,255,255,.45);
    border-top-color:#fff; border-radius:50%; animation:sp .7s linear infinite; display:none;
  }
  .cta.loading .spin{display:block}
  @keyframes sp{to{transform:rotate(360deg)}}
  .foot{text-align:center; color:#a7c0cf; font-size:11.5px; margin:18px 4px 0; line-height:1.5}

  /* panel da dang nhap */
  .done{text-align:center; padding:6px 2px 2px}
  .check{width:56px; height:56px; border-radius:50%; background:var(--accent-soft);
    display:grid; place-items:center; margin:2px auto 16px}
  .check svg{width:30px; height:30px}
  .done h2{font-size:20px; margin:0 0 3px; font-weight:700}
  .done .name{font-size:15px; color:var(--muted); margin:0 0 18px}
  .tags{display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin-bottom:22px}
  .tag{font-size:12.5px; font-weight:600; padding:6px 12px; border-radius:999px;
    background:var(--field); border:1px solid var(--line); color:#2b3a45}
  .tag b{color:var(--accent-d)}
  .signout{width:100%; height:44px; margin-top:10px; border:1px solid var(--line);
    background:#fff; border-radius:11px; font:inherit; font-size:14px; font-weight:600;
    color:var(--muted); cursor:pointer}
  .signout:hover{background:var(--field); color:var(--ink)}
  .hidden{display:none !important}

  @media (max-width:440px){
    body{padding:14px}
    .card{padding:26px 20px 24px; border-radius:16px}
    h1{font-size:23px}
  }
  @media (prefers-reduced-motion:reduce){ .spin{animation:none} .cta:active{transform:none} }
</style>
</head>
<body>
<main class="wrap">
  <div class="card">
    <div class="brand">
      <div class="mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none">
          <path d="M12 2.5C12 2.5 5.5 9.5 5.5 14.2a6.5 6.5 0 0 0 13 0C18.5 9.5 12 2.5 12 2.5Z"
                fill="#0e7d8a"/>
          <path d="M8 14.6c1.2 0 1.2 1.1 2.4 1.1s1.2-1.1 2.4-1.1 1.2 1.1 2.4 1.1"
                stroke="#fff" stroke-width="1.4" stroke-linecap="round" fill="none"/>
        </svg>
      </div>
      <div class="brand-text">
        <div class="sys">Mạng lưới ATVSV</div>
        <div class="org">Công ty CP Thủy điện Vĩnh Sơn - Sông Hinh</div>
      </div>
    </div>

    <!-- FORM DANG NHAP -->
    <div id="khoiDangNhap">
      <h1>Đăng nhập</h1>
      <p class="lead">Dùng tài khoản được cấp để vào hệ thống.</p>

      <div class="row">
        <label for="email">Email</label>
        <input id="email" class="field" type="email" autocomplete="username"
               inputmode="email" placeholder="ten@vsh.com.vn">
      </div>

      <div class="row">
        <label for="matkhau">Mật khẩu</label>
        <div class="pw">
          <input id="matkhau" class="field" type="password" autocomplete="current-password"
                 placeholder="Nhập mật khẩu">
          <button type="button" class="toggle" id="nutHien">Hiện</button>
        </div>
      </div>

      <div class="err" id="loi" role="alert" aria-live="assertive"></div>

      <button class="cta" id="nutDangNhap">
        <span class="spin" aria-hidden="true"></span>
        <span id="nhanNut">Đăng nhập</span>
      </button>
    </div>

    <!-- PANEL DA DANG NHAP -->
    <div id="khoiXong" class="done hidden">
      <div class="check" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none">
          <path d="M5 12.5l4.5 4.5L19 7.5" stroke="#0e7d8a" stroke-width="2.4"
                stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <h2>Đăng nhập thành công</h2>
      <p class="name" id="tenNguoiDung"></p>
      <div class="tags">
        <span class="tag">Đơn vị: <b id="tenDonVi"></b></span>
        <span class="tag">Vai trò: <b id="tenVaiTro"></b></span>
      </div>
      <button class="cta" id="nutTiepTuc">Vào hệ thống</button>
      <button class="signout" id="nutDangXuat">Đăng xuất</button>
    </div>
  </div>

  <p class="foot">Hệ thống quản lý An toàn vệ sinh viên · Nội bộ Công ty</p>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* =========================================================
   CẤU HÌNH
   ========================================================= */
const SUPABASE_URL = 'https://lasbxdhexxczzfrfkexn.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imxhc2J4ZGhleHhjenpmcmZrZXhuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAyOTAwMzcsImV4cCI6MjA5NTg2NjAzN30.YQD7CPkdG7kGz6qxUF4JJPz_Eb0IKsyq0KNcZ2lAtoA';

// Trang sẽ mở sau khi bấm "Vào hệ thống". Cho phép truyền qua ?next=ten-file.html
// (chỉ chấp nhận tên file .html thuần, không domain/đường dẫn, để tránh open-redirect).
// Không có/không hợp lệ -> mặc định quay về index.html.
const NEXT_RAW = new URLSearchParams(location.search).get('next') || '';
const TRANG_DICH = /^[A-Za-z0-9_.-]+\.html$/.test(NEXT_RAW) ? NEXT_RAW : 'index.html';
/* ========================================================= */

const TEN_DON_VI = { VS:'Vĩnh Sơn', SH:'Sông Hinh', TKT:'Thượng Kon Tum' };
const TEN_VAI_TRO = { quan_tri:'Quản trị hệ thống', quan_ly_dv:'Quản lý đơn vị', atvsv:'ATVSV' };

let sb = null;
if (window.supabase && SUPABASE_ANON_KEY.startsWith('eyJ')) {
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
}

const $ = id => document.getElementById(id);
const elEmail = $('email'), elMk = $('matkhau'), elLoi = $('loi');
const elNut = $('nutDangNhap'), elNhan = $('nhanNut');

function baoLoi(msg){ elLoi.textContent = msg; elLoi.classList.add('show'); }
function xoaLoi(){ elLoi.textContent = ''; elLoi.classList.remove('show'); }
function dangTai(bat){
  elNut.disabled = bat;
  elNut.classList.toggle('loading', bat);
  elNhan.textContent = bat ? 'Đang đăng nhập…' : 'Đăng nhập';
}

// hien / an mat khau
$('nutHien').addEventListener('click', () => {
  const hien = elMk.type === 'password';
  elMk.type = hien ? 'text' : 'password';
  $('nutHien').textContent = hien ? 'Ẩn' : 'Hiện';
  elMk.focus();
});

async function xuLyDangNhap(){
  xoaLoi();
  const email = elEmail.value.trim();
  const matKhau = elMk.value;

  if (!email || !matKhau){ baoLoi('Vui lòng nhập email và mật khẩu.'); return; }
  if (!sb){
    baoLoi('Chưa cấu hình kết nối. Kiểm tra lại khóa Supabase trong mã nguồn trang.');
    return;
  }

  dangTai(true);
  let kq;
  try{
    kq = await sb.auth.signInWithPassword({ email, password: matKhau });
  }catch(e){
    dangTai(false);
    baoLoi('Không kết nối được máy chủ. Kiểm tra mạng rồi thử lại.');
    return;
  }

  if (kq.error){
    dangTai(false);
    const m = kq.error.message || '';
    if (/Invalid login credentials/i.test(m))
      baoLoi('Email hoặc mật khẩu không đúng. Vui lòng thử lại.');
    else if (/Email not confirmed/i.test(m))
      baoLoi('Tài khoản chưa được xác nhận. Liên hệ quản trị viên.');
    else
      baoLoi('Không đăng nhập được. ' + m);
    return;
  }

  await taiHoSo(kq.data.user);
}

async function taiHoSo(user){
  let hoSo = null, loi = null;
  try{
    const r = await sb.from('nguoi_dung')
      .select('ho_ten, don_vi, vai_tro, chuc_vu, dang_hoat_dong')
      .eq('id', user.id).single();
    hoSo = r.data; loi = r.error;
  }catch(e){ loi = e; }

  if (loi || !hoSo){
    await sb.auth.signOut();
    dangTai(false);
    baoLoi('Đăng nhập được nhưng tài khoản chưa được cấp quyền trong hệ thống. Liên hệ quản trị viên để thêm vào danh sách người dùng.');
    return;
  }
  if (!hoSo.dang_hoat_dong){
    await sb.auth.signOut();
    dangTai(false);
    baoLoi('Tài khoản đã bị khóa. Liên hệ quản trị viên.');
    return;
  }
  hienThiXong(hoSo);
}

function hienThiXong(hoSo){
  dangTai(false);
  $('tenNguoiDung').textContent = hoSo.ho_ten + (hoSo.chuc_vu ? ' — ' + hoSo.chuc_vu : '');
  $('tenDonVi').textContent = TEN_DON_VI[hoSo.don_vi] || hoSo.don_vi;
  $('tenVaiTro').textContent = TEN_VAI_TRO[hoSo.vai_tro] || hoSo.vai_tro;
  $('khoiDangNhap').classList.add('hidden');
  $('khoiXong').classList.remove('hidden');
}

// nut trong panel
$('nutTiepTuc').addEventListener('click', () => { window.location.href = TRANG_DICH; });
$('nutDangXuat').addEventListener('click', async () => {
  if (sb) await sb.auth.signOut();
  $('khoiXong').classList.add('hidden');
  $('khoiDangNhap').classList.remove('hidden');
  elMk.value = ''; xoaLoi();
});

// su kien
elNut.addEventListener('click', xuLyDangNhap);
[elEmail, elMk].forEach(el => el.addEventListener('keydown', e => {
  if (e.key === 'Enter') xuLyDangNhap();
}));

// neu da co phien dang nhap tu truoc -> vao thang panel
(async () => {
  if (!sb) return;
  try{
    const { data:{ session } } = await sb.auth.getSession();
    if (session) await taiHoSo(session.user);
  }catch(e){}
})();
</script>
</body>
</html>
