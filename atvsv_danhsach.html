<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Danh sách ATVSV — Mạng lưới ATVSV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --deep-1:#0b2033; --deep-2:#123d59; --accent:#0e7d8a; --accent-d:#0a6570;
    --accent-soft:#e6f4f5; --ink:#15242f; --muted:#5f707c; --line:#e3eaee;
    --field:#f6f9fa; --danger:#b23b2e; --danger-bg:#fbecea; --danger-d:#8f2c22;
    --page:#eef2f4; --card:#ffffff;
  }
  *{box-sizing:border-box}
  body{
    margin:0; font-family:"Be Vietnam Pro",system-ui,sans-serif; color:var(--ink);
    background:var(--page); -webkit-font-smoothing:antialiased; font-size:14px;
  }

  .container{max-width:1160px; margin:0 auto; padding:22px 18px 60px}
  .head{display:flex; align-items:flex-end; gap:12px; flex-wrap:wrap; margin-bottom:6px}
  h1{font-size:22px; font-weight:700; margin:0; letter-spacing:-.01em}
  .count{color:var(--muted); font-size:13px; font-weight:500; padding-bottom:2px}

  .phien-bar{font-size:13px; color:var(--muted); margin:0 0 16px}
  .phien-bar b{color:var(--ink)}

  .toolbar{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:14px}
  .btn{height:42px; padding:0 16px; border-radius:10px; font:inherit; font-size:14px;
    font-weight:600; cursor:pointer; border:1px solid var(--line); display:inline-flex;
    align-items:center; gap:7px; white-space:nowrap; background:#fff; color:var(--ink)}
  .btn:hover{background:var(--field)}
  .btn svg{width:17px;height:17px}
  .btn-primary{background:var(--accent); color:#fff; border-color:var(--accent)}
  .btn-primary:hover{background:var(--accent-d)}
  .btn-ghost{background:#fff; color:var(--ink); border-color:var(--line)}
  .btn-ghost:hover{background:var(--field)}
  .btn-danger{background:var(--danger); color:#fff}
  .btn-danger:hover{background:var(--danger-d)}
  .search{position:relative; flex:1; min-width:220px}
  .search input{width:100%; height:42px; border:1px solid var(--line); background:#fff;
    border-radius:10px; padding:0 14px 0 40px; font:inherit; font-size:14px}
  .search input:focus{outline:none; border-color:var(--accent);
    box-shadow:0 0 0 3px rgba(14,125,138,.14)}
  .search svg{position:absolute; left:13px; top:12px; width:18px; height:18px; stroke:var(--muted)}
  select.filt{height:42px; border:1px solid var(--line); background:#fff; border-radius:10px;
    padding:0 12px; font:inherit; font-size:14px; color:var(--ink); cursor:pointer}
  select.filt:focus{outline:none; border-color:var(--accent)}

  .panel{background:var(--card); border:1px solid var(--line); border-radius:14px; overflow:hidden}
  .scroll{overflow-x:auto}
  table{width:100%; border-collapse:collapse; min-width:860px}
  thead th{background:#f4f8f9; text-align:left; font-size:12px; font-weight:700;
    color:#41525d; text-transform:uppercase; letter-spacing:.03em; padding:12px 14px;
    border-bottom:1px solid var(--line); white-space:nowrap}
  tbody td{padding:12px 14px; border-bottom:1px solid #eef2f4; vertical-align:middle; white-space:nowrap}
  tbody tr:last-child td{border-bottom:none}
  tbody tr:hover{background:#fafcfc}
  td.stt{color:var(--muted); font-variant-numeric:tabular-nums; width:44px}
  td.ten{font-weight:600}
  .acts{display:flex; gap:6px; justify-content:flex-end}
  .icon-btn{width:32px; height:32px; border-radius:8px; border:1px solid var(--line);
    background:#fff; cursor:pointer; display:grid; place-items:center}
  .icon-btn svg{width:16px;height:16px}
  .icon-btn:hover{background:var(--field)}
  .icon-btn.del:hover{background:var(--danger-bg); border-color:#f2d2cd}
  .icon-btn.del svg{stroke:var(--danger)}

  .state{padding:48px 20px; text-align:center; color:var(--muted)}
  .state .big{font-size:15px; font-weight:600; color:#41525d; margin-bottom:4px}
  .spin{width:22px;height:22px;border:2.5px solid var(--line);border-top-color:var(--accent);
    border-radius:50%;animation:sp .7s linear infinite;margin:0 auto 12px}
  @keyframes sp{to{transform:rotate(360deg)}}

  /* modal */
  .overlay{position:fixed; inset:0; background:rgba(9,24,36,.55); display:none;
    align-items:flex-start; justify-content:center; padding:28px 16px; z-index:50; overflow-y:auto}
  .overlay.show{display:flex}
  .modal{background:#fff; border-radius:16px; width:100%; max-width:560px; margin:auto;
    box-shadow:0 24px 60px -20px rgba(3,20,33,.5)}
  .modal-h{padding:18px 22px; border-bottom:1px solid var(--line); display:flex;
    align-items:center; justify-content:space-between}
  .modal-h h3{margin:0; font-size:17px; font-weight:700}
  .x{width:32px;height:32px;border:none;background:var(--field);border-radius:8px;cursor:pointer;
    font-size:17px;color:var(--muted);line-height:1}
  .x:hover{background:#e7edf0}
  .modal-b{padding:20px 22px}
  .grid{display:grid; grid-template-columns:1fr 1fr; gap:14px}
  .fld{display:flex; flex-direction:column}
  .fld.full{grid-column:1/-1}
  .fld label{font-size:12.5px; font-weight:600; margin-bottom:6px; color:#2b3a45}
  .fld label .req{color:var(--danger)}
  .fld input, .fld select{height:42px; border:1px solid var(--line);
    background:var(--field); border-radius:10px; padding:0 12px; font:inherit; font-size:14px; color:var(--ink)}
  .fld input:focus, .fld select:focus{outline:none;
    border-color:var(--accent); background:#fff; box-shadow:0 0 0 3px rgba(14,125,138,.14)}
  .modal-err{display:none; background:var(--danger-bg); color:var(--danger); font-size:13px;
    border:1px solid #f2d2cd; border-radius:10px; padding:10px 12px; margin-top:4px}
  .modal-err.show{display:block}
  .modal-f{padding:16px 22px; border-top:1px solid var(--line); display:flex;
    justify-content:flex-end; gap:10px}

  .confirm{max-width:400px; text-align:center}
  .confirm .modal-b{padding:26px 22px 10px}
  .confirm .warn{width:52px;height:52px;border-radius:50%;background:var(--danger-bg);
    display:grid;place-items:center;margin:0 auto 14px}
  .confirm .warn svg{width:26px;height:26px;stroke:var(--danger)}
  .confirm h3{margin:0 0 6px;font-size:17px}
  .confirm p{margin:0;color:var(--muted);font-size:13.5px;line-height:1.5}

  @media (max-width:640px){
    h1{font-size:20px}
    .grid{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<div class="container">
  <div class="head">
    <h1>Danh sách ATVSV</h1>
    <span class="count" id="soLuong"></span>
  </div>

  <div class="phien-bar" id="thanhPhien" style="display:none">
    Đang đăng nhập: <b id="phienTen"></b> — có quyền thêm/sửa/xóa danh sách này.
  </div>

  <div class="toolbar">
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3" stroke-linecap="round"/></svg>
      <input id="oTimKiem" placeholder="Tìm theo họ tên, chức vụ, số QĐ, điện thoại…">
    </div>
    <select class="filt" id="locDonVi">
      <option value="">Tất cả đơn vị</option>
      <option value="VS">Vĩnh Sơn</option>
      <option value="SH">Sông Hinh</option>
      <option value="TKT">Thượng Kon Tum</option><option value="TT_DVTV">TT DVTV</option>
    </select>
    <button class="btn" id="nutXuat">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0 4-4m-4 4-4-4"/><path d="M4 17v2a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-2"/></svg>
      <span>Xuất file</span>
    </button>
    <button class="btn btn-primary" id="nutThem" style="display:none">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      <span>Thêm ATVSV</span>
    </button>
  </div>

  <div class="panel">
    <div id="trangThai" class="state"><div class="spin"></div>Đang tải dữ liệu…</div>
    <div class="scroll" id="khungBang" style="display:none">
      <table>
        <thead>
          <tr id="hangTieuDe">
            <th>STT</th><th>Họ tên</th><th>Ngày sinh</th><th>Chức vụ</th>
            <th>Đơn vị</th><th>Ngày quyết định</th><th>Số quyết định</th><th>Điện thoại</th>
          </tr>
        </thead>
        <tbody id="thanBang"></tbody>
      </table>
    </div>
  </div>
</div>

<!-- MODAL THEM/SUA -->
<div class="overlay" id="modalForm">
  <div class="modal">
    <div class="modal-h">
      <h3 id="tieuDeForm">Thêm ATVSV</h3>
      <button class="x" data-dong>×</button>
    </div>
    <div class="modal-b">
      <div class="grid">
        <div class="fld full">
          <label>Họ và tên <span class="req">*</span></label>
          <input id="f_ho_ten" placeholder="Nguyễn Văn A">
        </div>
        <div class="fld">
          <label>Ngày sinh</label>
          <input id="f_ngay_sinh" type="date">
        </div>
        <div class="fld">
          <label>Chức vụ</label>
          <input id="f_chuc_vu" placeholder="Trực chính">
        </div>
        <div class="fld">
          <label>Đơn vị <span class="req">*</span></label>
          <select id="f_don_vi">
            <option value="VS">Vĩnh Sơn</option>
            <option value="SH">Sông Hinh</option>
            <option value="TKT">Thượng Kon Tum</option>
            <option value="TT_DVTV">TT DVTV</option>
          </select>
        </div>
        <div class="fld">
          <label>Điện thoại</label>
          <input id="f_dien_thoai" inputmode="tel" placeholder="09xx xxx xxx">
        </div>
        <div class="fld">
          <label>Số quyết định</label>
          <input id="f_so_qd" placeholder="123/QĐ-…">
        </div>
        <div class="fld">
          <label>Ngày quyết định</label>
          <input id="f_ngay_qd" type="date">
        </div>
      </div>
      <div class="modal-err" id="loiForm"></div>
    </div>
    <div class="modal-f">
      <button class="btn btn-ghost" data-dong>Hủy</button>
      <button class="btn btn-primary" id="nutLuu">Lưu</button>
    </div>
  </div>
</div>

<!-- CONFIRM XOA -->
<div class="overlay" id="modalXoa">
  <div class="modal confirm">
    <div class="modal-b">
      <div class="warn"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4m0 4h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/></svg></div>
      <h3>Xóa ATVSV</h3>
      <p id="xoaNoiDung">Bạn có chắc muốn xóa?</p>
    </div>
    <div class="modal-f" style="justify-content:center">
      <button class="btn btn-ghost" data-dong-xoa>Hủy</button>
      <button class="btn btn-danger" id="nutXacNhanXoa">Xóa</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
/* ===== CẤU HÌNH ===== */
const SUPABASE_URL = 'https://lasbxdhexxczzfrfkexn.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imxhc2J4ZGhleHhjenpmcmZrZXhuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAyOTAwMzcsImV4cCI6MjA5NTg2NjAzN30.YQD7CPkdG7kGz6qxUF4JJPz_Eb0IKsyq0KNcZ2lAtoA';
/* ==================== */

const TEN_DON_VI = { VS:'Vĩnh Sơn', SH:'Sông Hinh', TKT:'Thượng Kon Tum', TT_DVTV:'TT DVTV' };
const KHOA_PHIEN = 'phien_dangnhap';

let sb = null;
if (window.supabase && SUPABASE_ANON_KEY.startsWith('eyJ'))
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const $ = id => document.getElementById(id);
let danhSachGoc = [];
let dangSua = null;
let phien = null;

function esc(s){ return (s??'').toString().replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function fmtNgay(d){ if(!d) return '—'; const [y,m,dd] = d.split('-'); return `${dd}/${m}/${y}`; }

/* ---------- PHIÊN ĐĂNG NHẬP (dùng chung, chỉ đọc — đăng nhập ở tab Đăng nhập) ---------- */
function napPhien(){
  try{ phien = JSON.parse(sessionStorage.getItem(KHOA_PHIEN)); }catch(e){ phien = null; }
  apDungPhien();
}
function laNhanVienDuyet(){ return !!phien && (phien.vai_tro==='ky_su_an_toan' || phien.vai_tro==='quan_tri'); }
function apDungPhien(){
  const coQuyen = laNhanVienDuyet();
  if (phien){ $('thanhPhien').style.display=''; $('phienTen').textContent = phien.ho_ten; }
  else { $('thanhPhien').style.display='none'; }
  $('nutThem').style.display = coQuyen ? '' : 'none';
}
window.lamMoiKhiHienThi = function(){ napPhien(); loc(); };

async function khoiTao(){
  napPhien();
  await napDanhSach();
}

async function napDanhSach(){
  const r = await sb.from('atvsv')
    .select('id, ho_ten, ngay_sinh, chuc_vu, don_vi, ngay_qd, so_qd, dien_thoai')
    .order('don_vi').order('ho_ten');
  if (r.error){
    $('trangThai').innerHTML = 'Không tải được danh sách. Thử tải lại trang.';
    return;
  }
  danhSachGoc = r.data || [];
  loc();
}

function layDsLoc(){
  const tu = $('oTimKiem').value.trim().toLowerCase();
  const dv = $('locDonVi').value;
  return danhSachGoc.filter(x=>{
    if (dv && x.don_vi !== dv) return false;
    if (!tu) return true;
    return [x.ho_ten, x.chuc_vu, x.so_qd, x.dien_thoai].some(v=>(v||'').toLowerCase().includes(tu));
  });
}

function loc(){
  veBang(layDsLoc());
}

function xuatExcel(){
  const ds = layDsLoc();
  if (!ds.length){ alert('Không có dữ liệu để xuất.'); return; }
  const rows = ds.map(x=>({
    'Họ tên': x.ho_ten,
    'Ngày sinh': fmtNgay(x.ngay_sinh).replace('—',''),
    'Chức vụ': x.chuc_vu||'',
    'Đơn vị': TEN_DON_VI[x.don_vi]||x.don_vi||'',
    'Ngày quyết định': fmtNgay(x.ngay_qd).replace('—',''),
    'Số quyết định': x.so_qd||'',
    'Điện thoại': x.dien_thoai||'',
  }));
  const ws = XLSX.utils.json_to_sheet(rows);
  ws['!cols'] = [{wch:22},{wch:13},{wch:16},{wch:16},{wch:15},{wch:14},{wch:13}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Danh sach ATVSV');
  const ngay = new Date().toISOString().slice(0,10);
  XLSX.writeFile(wb, `Danh_sach_ATVSV_${ngay}.xlsx`);
}

function veBang(ds){
  $('soLuong').textContent = danhSachGoc.length ? `${ds.length} người` : '';
  $('trangThai').style.display = 'none';
  $('khungBang').style.display = '';

  if (!ds.length){
    $('khungBang').style.display = 'none';
    $('trangThai').style.display = '';
    $('trangThai').innerHTML = danhSachGoc.length
      ? '<div class="big">Không tìm thấy</div>Không có ATVSV nào khớp bộ lọc.'
      : '<div class="big">Chưa có dữ liệu</div>Danh sách đang trống.';
    return;
  }

  const coQuyen = laNhanVienDuyet();
  const colsHtml = ['STT','Họ tên','Ngày sinh','Chức vụ','Đơn vị','Ngày quyết định','Số quyết định','Điện thoại']
    .concat(coQuyen ? [''] : []).map(c=>`<th>${c}</th>`).join('');
  $('hangTieuDe').innerHTML = colsHtml;

  $('thanBang').innerHTML = ds.map((x,i)=>{
    let h = `<tr>
    <td class="stt">${i+1}</td>
    <td class="ten">${esc(x.ho_ten)}</td>
    <td>${fmtNgay(x.ngay_sinh)}</td>
    <td>${esc(x.chuc_vu)||'—'}</td>
    <td>${TEN_DON_VI[x.don_vi]||esc(x.don_vi)}</td>
    <td>${fmtNgay(x.ngay_qd)}</td>
    <td>${esc(x.so_qd)||'—'}</td>
    <td>${esc(x.dien_thoai)||'—'}</td>`;
    if (coQuyen){
      h += `<td><div class="acts">
        <button class="icon-btn" data-sua="${x.id}" title="Sửa"><svg viewBox="0 0 24 24" fill="none" stroke="#41525d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button>
        <button class="icon-btn del" data-xoa="${x.id}" title="Xóa"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2m1 0-1 14a1 1 0 0 1-1 1H8a1 1 0 0 1-1-1L6 6"/></svg></button>
      </div></td>`;
    }
    return h + `</tr>`;
  }).join('');

  $('thanBang').querySelectorAll('[data-sua]').forEach(b=>b.onclick=()=>moForm(b.dataset.sua));
  $('thanBang').querySelectorAll('[data-xoa]').forEach(b=>b.onclick=()=>hoiXoa(b.dataset.xoa));
}

/* ---------- FORM THÊM / SỬA ---------- */
function ycMoForm(id){
  napPhien();
  if (!laNhanVienDuyet()){ alert('Cần đăng nhập với vai trò Kỹ sư an toàn hoặc Quản trị viên ở tab "Đăng nhập" để thực hiện thao tác này.'); return; }
  moForm(id);
}
function moForm(id){
  dangSua = id || null;
  $('loiForm').classList.remove('show');
  $('tieuDeForm').textContent = id ? 'Sửa thông tin ATVSV' : 'Thêm ATVSV';
  const x = id ? danhSachGoc.find(r=>r.id===id) : {};
  $('f_ho_ten').value = x.ho_ten || '';
  $('f_ngay_sinh').value = x.ngay_sinh || '';
  $('f_chuc_vu').value = x.chuc_vu || '';
  $('f_don_vi').value = x.don_vi || 'VS';
  $('f_dien_thoai').value = x.dien_thoai || '';
  $('f_so_qd').value = x.so_qd || '';
  $('f_ngay_qd').value = x.ngay_qd || '';
  $('modalForm').classList.add('show');
  $('f_ho_ten').focus();
}
function dongForm(){ $('modalForm').classList.remove('show'); }

async function luu(){
  napPhien();
  if (!laNhanVienDuyet()){ dongForm(); return; }
  const ten = $('f_ho_ten').value.trim();
  if (!ten){ baoLoiForm('Vui lòng nhập họ và tên.'); return; }

  const ban = {
    ho_ten: ten,
    ngay_sinh: $('f_ngay_sinh').value || null,
    chuc_vu: $('f_chuc_vu').value.trim() || null,
    don_vi: $('f_don_vi').value,
    dien_thoai: $('f_dien_thoai').value.trim() || null,
    so_qd: $('f_so_qd').value.trim() || null,
    ngay_qd: $('f_ngay_qd').value || null,
  };

  $('nutLuu').disabled = true; $('nutLuu').textContent = 'Đang lưu…';
  let err;
  if (dangSua){
    ({ error:err } = await sb.from('atvsv').update(ban).eq('id', dangSua));
  } else {
    ({ error:err } = await sb.from('atvsv').insert(ban));
  }
  $('nutLuu').disabled = false; $('nutLuu').textContent = 'Lưu';

  if (err){ baoLoiForm('Không lưu được: ' + err.message); return; }
  dongForm();
  await napDanhSach();
}
function baoLoiForm(m){ const e=$('loiForm'); e.textContent=m; e.classList.add('show'); }

/* ---------- XÓA ---------- */
let idXoa = null;
function hoiXoa(id){
  napPhien();
  if (!laNhanVienDuyet()){ alert('Cần đăng nhập với vai trò Kỹ sư an toàn hoặc Quản trị viên ở tab "Đăng nhập" để thực hiện thao tác này.'); return; }
  const x = danhSachGoc.find(r=>r.id===id);
  idXoa = id;
  $('xoaNoiDung').innerHTML = `Xóa <b>${esc(x.ho_ten)}</b> khỏi danh sách? Thao tác này không thể hoàn tác.`;
  $('modalXoa').classList.add('show');
}
async function xacNhanXoa(){
  if (!idXoa) return;
  $('nutXacNhanXoa').disabled = true; $('nutXacNhanXoa').textContent = 'Đang xóa…';
  const { error } = await sb.from('atvsv').delete().eq('id', idXoa);
  $('nutXacNhanXoa').disabled = false; $('nutXacNhanXoa').textContent = 'Xóa';
  $('modalXoa').classList.remove('show');
  if (error){ alert('Không xóa được: ' + error.message); return; }
  idXoa = null;
  await napDanhSach();
}

$('oTimKiem').oninput = loc;
$('locDonVi').onchange = loc;
$('nutXuat').onclick = xuatExcel;
$('nutThem').onclick = ()=>ycMoForm(null);
$('nutLuu').onclick = luu;
$('nutXacNhanXoa').onclick = xacNhanXoa;
document.querySelectorAll('[data-dong]').forEach(b=>b.onclick=dongForm);
document.querySelectorAll('[data-dong-xoa]').forEach(b=>b.onclick=()=>$('modalXoa').classList.remove('show'));
[$('modalForm'),$('modalXoa')].forEach(o=>o.onclick=e=>{ if(e.target===o) o.classList.remove('show'); });

khoiTao();
</script>
