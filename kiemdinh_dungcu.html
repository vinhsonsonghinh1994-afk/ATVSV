<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dụng cụ an toàn đơn vị — Mạng lưới ATVSV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --deep-1:#0b2033; --deep-2:#123d59; --accent:#0e7d8a; --accent-d:#0a6570;
    --accent-soft:#e6f4f5; --ink:#15242f; --muted:#5f707c; --line:#e3eaee;
    --field:#f6f9fa; --danger:#b23b2e; --danger-bg:#fbecea; --danger-d:#8f2c22;
    --ok:#0f7d5a; --ok-bg:#e6f5ef; --page:#eef2f4; --card:#ffffff;
  }
  *{box-sizing:border-box}
  body{
    margin:0; font-family:"Be Vietnam Pro",system-ui,sans-serif; color:var(--ink);
    background:var(--page); -webkit-font-smoothing:antialiased; font-size:14px;
  }

  .container{max-width:1240px; margin:0 auto; padding:22px 18px 60px}
  .head{display:flex; align-items:flex-end; gap:12px; flex-wrap:wrap; margin-bottom:18px}
  h1{font-size:22px; font-weight:700; margin:0; letter-spacing:-.01em}
  .count{color:var(--muted); font-size:13px; font-weight:500; padding-bottom:2px}

  .toolbar{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:14px}
  .search{position:relative; flex:1; min-width:200px}
  .search input{width:100%; height:42px; border:1px solid var(--line); background:#fff;
    border-radius:10px; padding:0 14px 0 40px; font:inherit; font-size:14px}
  .search input:focus{outline:none; border-color:var(--accent);
    box-shadow:0 0 0 3px rgba(14,125,138,.14)}
  .search svg{position:absolute; left:13px; top:12px; width:18px; height:18px; stroke:var(--muted)}

  .btn{height:42px; padding:0 16px; border-radius:10px; font:inherit; font-size:14px;
    font-weight:600; cursor:pointer; border:1px solid transparent; display:inline-flex;
    align-items:center; gap:7px; white-space:nowrap}
  .btn svg{width:17px;height:17px}
  .btn-primary{background:var(--accent); color:#fff}
  .btn-primary:hover{background:var(--accent-d)}
  .btn-ghost{background:#fff; color:var(--ink); border-color:var(--line)}
  .btn-ghost:hover{background:var(--field)}
  .btn-danger{background:var(--danger); color:#fff}
  .btn-danger:hover{background:var(--danger-d)}
  .btn-sm{height:32px; padding:0 12px; font-size:12.5px; border-radius:8px}

  /* bang */
  .panel{background:var(--card); border:1px solid var(--line); border-radius:14px; overflow:hidden}
  .scroll{overflow-x:auto}
  table{width:100%; border-collapse:collapse; min-width:960px}
  thead th{background:#f4f8f9; text-align:left; font-size:12px; font-weight:700;
    color:#41525d; text-transform:uppercase; letter-spacing:.03em; padding:12px 14px;
    border-bottom:1px solid var(--line); white-space:nowrap}
  tbody td{padding:12px 14px; border-bottom:1px solid #eef2f4; vertical-align:middle}
  tbody tr:last-child td{border-bottom:none}
  tbody tr:hover{background:#fafcfc}
  td.stt{color:var(--muted); font-variant-numeric:tabular-nums; width:44px}
  td.ten{font-weight:600}
  td.nd{max-width:220px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:#33434e}
  .acts{display:flex; gap:6px; justify-content:flex-end}
  .icon-btn{width:32px; height:32px; border-radius:8px; border:1px solid var(--line);
    background:#fff; cursor:pointer; display:grid; place-items:center}
  .icon-btn svg{width:16px;height:16px}
  .icon-btn:hover{background:var(--field)}
  .icon-btn.del:hover{background:var(--danger-bg); border-color:#f2d2cd}
  .icon-btn.del svg{stroke:var(--danger)}
  .link-btn{display:inline-flex; align-items:center; gap:5px; height:30px; padding:0 12px;
    border-radius:8px; background:var(--accent-soft); color:var(--accent-d); text-decoration:none;
    font-size:12.5px; font-weight:700; white-space:nowrap; border:none; cursor:pointer; font-family:inherit}
  .link-btn:hover{background:#d8eef0}

  .badge{display:inline-block; font-size:12px; font-weight:700; padding:4px 10px; border-radius:999px; white-space:nowrap}
  .badge.dat{background:var(--ok-bg); color:var(--ok)}
  .badge.khong_dat{background:var(--danger-bg); color:var(--danger)}

  .state{padding:48px 20px; text-align:center; color:var(--muted)}
  .state .big{font-size:15px; font-weight:600; color:#41525d; margin-bottom:4px}
  .spin{width:22px;height:22px;border:2.5px solid var(--line);border-top-color:var(--accent);
    border-radius:50%;animation:sp .7s linear infinite;margin:0 auto 12px}
  @keyframes sp{to{transform:rotate(360deg)}}

  /* modal */
  .overlay{position:fixed; inset:0; background:rgba(9,24,36,.55); display:none;
    align-items:flex-start; justify-content:center; padding:28px 16px; z-index:50; overflow-y:auto}
  .overlay.show{display:flex}
  .modal{background:#fff; border-radius:16px; width:100%; max-width:560px; margin:auto;
    box-shadow:0 24px 60px -20px rgba(3,20,33,.5)}
  .modal.wide{max-width:760px}
  .modal-h{padding:18px 22px; border-bottom:1px solid var(--line); display:flex;
    align-items:center; justify-content:space-between}
  .modal-h h3{margin:0; font-size:17px; font-weight:700}
  .x{width:32px;height:32px;border:none;background:var(--field);border-radius:8px;cursor:pointer;
    font-size:17px;color:var(--muted);line-height:1}
  .x:hover{background:#e7edf0}
  .modal-b{padding:20px 22px}
  .grid{display:grid; grid-template-columns:1fr 1fr; gap:14px}
  .fld{display:flex; flex-direction:column}
  .fld.full{grid-column:1/-1}
  .fld label{font-size:12.5px; font-weight:600; margin-bottom:6px; color:#2b3a45}
  .fld label .req{color:var(--danger)}
  .fld input, .fld select, .fld textarea{height:42px; border:1px solid var(--line);
    background:var(--field); border-radius:10px; padding:0 12px; font:inherit; font-size:14px; color:var(--ink)}
  .fld textarea{height:auto; min-height:64px; padding:10px 12px; resize:vertical}
  .fld input:focus, .fld select:focus, .fld textarea:focus{outline:none;
    border-color:var(--accent); background:#fff; box-shadow:0 0 0 3px rgba(14,125,138,.14)}
  .hint{font-size:11.5px; color:var(--muted); margin-top:5px}
  .modal-err{display:none; background:var(--danger-bg); color:var(--danger); font-size:13px;
    border:1px solid #f2d2cd; border-radius:10px; padding:10px 12px; margin-top:4px}
  .modal-err.show{display:block}
  .modal-f{padding:16px 22px; border-top:1px solid var(--line); display:flex;
    justify-content:flex-end; gap:10px}

  /* confirm xoa */
  .confirm{max-width:400px; text-align:center}
  .confirm .modal-b{padding:26px 22px 10px}
  .confirm .warn{width:52px;height:52px;border-radius:50%;background:var(--danger-bg);
    display:grid;place-items:center;margin:0 auto 14px}
  .confirm .warn svg{width:26px;height:26px;stroke:var(--danger)}
  .confirm h3{margin:0 0 6px;font-size:17px}
  .confirm p{margin:0;color:var(--muted);font-size:13.5px;line-height:1.5}

  /* lich su TN */
  .ls-toolbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; gap:10px; flex-wrap:wrap}
  .ls-sub{color:var(--muted); font-size:13px}
  .ls-form{background:var(--field); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:14px; display:none}
  .ls-form.show{display:block}
  .ls-form .grid{margin-bottom:10px}
  .ls-form .row-btn{display:flex; justify-content:flex-end; gap:8px}
  .ls-empty{padding:24px; text-align:center; color:var(--muted); font-size:13px}
  table.ls-table{min-width:0}
  table.ls-table thead th{position:static}

  @media (max-width:640px){
    .grid{grid-template-columns:1fr}
    h1{font-size:20px}
    .btn span.lbl{display:none}
    .btn{padding:0 13px}
    td.nd{max-width:140px}
  }
</style>
</head>
<body>
<div class="container">
  <div class="head">
    <h1 id="tieuDeTrang">Dụng cụ an toàn</h1>
    <span class="count" id="soLuong"></span>
  </div>

  <div class="toolbar">
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3" stroke-linecap="round"/></svg>
      <input id="oTimKiem" placeholder="Tìm theo tên dụng cụ, mã hiệu…">
    </div>
    <button class="btn btn-primary" id="nutThem" style="display:none">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      <span class="lbl">Thêm dụng cụ</span>
    </button>
  </div>

  <div class="panel">
    <div id="trangThai" class="state"><div class="spin"></div>Đang tải dữ liệu…</div>
    <div class="scroll" id="khungBang" style="display:none">
      <table>
        <thead><tr id="hangTieuDe"></tr></thead>
        <tbody id="thanBang"></tbody>
      </table>
    </div>
  </div>
</div>

<!-- MODAL THEM/SUA DUNG CU -->
<div class="overlay" id="modalForm">
  <div class="modal">
    <div class="modal-h">
      <h3 id="tieuDeForm">Thêm dụng cụ</h3>
      <button class="x" data-dong>×</button>
    </div>
    <div class="modal-b">
      <div class="grid">
        <div class="fld full">
          <label>Tên dụng cụ an toàn <span class="req">*</span></label>
          <input id="f_ten" placeholder="Ví dụ: Sào cách điện">
        </div>
        <div class="fld">
          <label>Nước SX</label>
          <input id="f_nuoc_sx" placeholder="Ví dụ: Pháp">
        </div>
        <div class="fld">
          <label>Năm SX</label>
          <input id="f_nam_sx" placeholder="Ví dụ: 1993">
        </div>
        <div class="fld">
          <label>Mã hiệu</label>
          <input id="f_ma_hieu" placeholder="Ví dụ: SVHVS-01">
        </div>
        <div class="fld">
          <label>Thông số kỹ thuật</label>
          <input id="f_thong_so" placeholder="Ví dụ: 90 kV">
        </div>
        <div class="fld">
          <label>Số lượng</label>
          <input id="f_so_luong" type="number" min="0" placeholder="Ví dụ: 1">
        </div>
        <div class="fld">
          <label>Định kỳ TN</label>
          <input id="f_dinh_ky" placeholder="Ví dụ: 1 năm">
        </div>
      </div>
      <div class="modal-err" id="loiForm"></div>
    </div>
    <div class="modal-f">
      <button class="btn btn-ghost" data-dong>Hủy</button>
      <button class="btn btn-primary" id="nutLuu">Lưu</button>
    </div>
  </div>
</div>

<!-- MODAL LICH SU THU NGHIEM -->
<div class="overlay" id="modalLS">
  <div class="modal wide">
    <div class="modal-h">
      <h3 id="tieuDeLS">Lịch sử thử nghiệm</h3>
      <button class="x" data-dong-ls>×</button>
    </div>
    <div class="modal-b">
      <div class="ls-toolbar">
        <span class="ls-sub" id="lsSub"></span>
        <button class="btn btn-primary btn-sm" id="nutThemTN" style="display:none">+ Thêm lần TN</button>
      </div>

      <div class="ls-form" id="lsForm">
        <div class="grid">
          <div class="fld full">
            <label>Số BB / Ngày, tháng, năm TN</label>
            <input id="tn_so_bb" placeholder="Ví dụ: Số 02-12/Ngày 24/12/2026">
          </div>
          <div class="fld">
            <label>Kết quả</label>
            <select id="tn_ket_qua">
              <option value="dat">Đạt</option>
              <option value="khong_dat">Không đạt</option>
            </select>
          </div>
          <div class="fld full">
            <label>Ghi chú</label>
            <input id="tn_ghi_chu" placeholder="Ví dụ: Lần TN tiếp theo: Tháng 6/2027">
          </div>
        </div>
        <div class="modal-err" id="loiLSForm"></div>
        <div class="row-btn">
          <button class="btn btn-ghost btn-sm" id="nutHuyTN">Hủy</button>
          <button class="btn btn-primary btn-sm" id="nutLuuTN">Lưu</button>
        </div>
      </div>

      <div id="khungLS">
        <div class="scroll">
          <table class="ls-table">
            <thead>
              <tr>
                <th>Số BB / Ngày, tháng, năm TN</th>
                <th>Kết quả</th>
                <th>Ghi chú</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="thanLS"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- CONFIRM XOA DUNG CU -->
<div class="overlay" id="modalXoa">
  <div class="modal confirm">
    <div class="modal-b">
      <div class="warn"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4m0 4h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/></svg></div>
      <h3>Xóa dụng cụ</h3>
      <p id="xoaNoiDung">Bạn có chắc muốn xóa?</p>
    </div>
    <div class="modal-f" style="justify-content:center">
      <button class="btn btn-ghost" data-dong-xoa>Hủy</button>
      <button class="btn btn-danger" id="nutXacNhanXoa">Xóa</button>
    </div>
  </div>
</div>

<!-- CONFIRM XOA LAN TN -->
<div class="overlay" id="modalXoaTN">
  <div class="modal confirm">
    <div class="modal-b">
      <div class="warn"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4m0 4h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/></svg></div>
      <h3>Xóa lần thử nghiệm</h3>
      <p>Bạn có chắc muốn xóa lần thử nghiệm này?</p>
    </div>
    <div class="modal-f" style="justify-content:center">
      <button class="btn btn-ghost" data-dong-xoa-tn>Hủy</button>
      <button class="btn btn-danger" id="nutXacNhanXoaTN">Xóa</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const TEN_DON_VI = { VS:'NM Vĩnh Sơn', SH:'NM Sông Hinh', TKT:'NM Thượng Kon Tum', TT_DVTV:'Trung tâm DVTV' };
const DV_TRANG = new URLSearchParams(location.search).get('dv') || 'VS';
const TIEU_DE_TRANG = 'Dụng cụ an toàn — ' + (TEN_DON_VI[DV_TRANG] || DV_TRANG);
const TEN_KET_QUA = { dat:'Đạt', khong_dat:'Không đạt' };
const KHOA_PHIEN = 'phien_dangnhap';

/* ===== CẤU HÌNH (giống các trang khác) ===== */
const SUPABASE_URL = 'https://lasbxdhexxczzfrfkexn.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imxhc2J4ZGhleHhjenpmcmZrZXhuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAyOTAwMzcsImV4cCI6MjA5NTg2NjAzN30.YQD7CPkdG7kGz6qxUF4JJPz_Eb0IKsyq0KNcZ2lAtoA';
/* ============================================ */

document.title = TIEU_DE_TRANG + ' — Mạng lưới ATVSV';
document.getElementById('tieuDeTrang').textContent = TIEU_DE_TRANG;

let sb = null;
if (window.supabase && SUPABASE_ANON_KEY.startsWith('eyJ'))
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const $ = id => document.getElementById(id);
let danhSachGoc = [];       // dung cu
let soLanTN = {};           // dung_cu_id -> so lan TN
let dangSua = null;         // id dung cu dang sua, null = them moi
let phien = null;

/* ---------- PHIÊN ĐĂNG NHẬP (dùng chung, chỉ đọc — đăng nhập ở tab Đăng nhập) ---------- */
function napPhien(){
  try{ phien = JSON.parse(sessionStorage.getItem(KHOA_PHIEN)); }catch(e){ phien = null; }
  $('nutThem').style.display = coTheThem() ? '' : 'none';
}
function coTheThem(){
  if (!phien) return false;
  if (phien.vai_tro==='quan_tri' || phien.vai_tro==='ky_su_an_toan') return true;
  if (phien.vai_tro==='phu_trach_nha_may') return phien.don_vi===DV_TRANG;
  return false;
}
function coTheXoa(){ return !!phien && (phien.vai_tro==='quan_tri' || phien.vai_tro==='ky_su_an_toan'); }
window.lamMoiKhiHienThi = function(){ napPhien(); loc(); };

function esc(s){ return (s??'').toString().replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function fmtNgayGio(iso){
  if(!iso) return '—';
  const d = new Date(iso);
  if (isNaN(d)) return '—';
  const dd=String(d.getDate()).padStart(2,'0'), mm=String(d.getMonth()+1).padStart(2,'0');
  const hh=String(d.getHours()).padStart(2,'0'), mi=String(d.getMinutes()).padStart(2,'0');
  return `${dd}/${mm}/${d.getFullYear()} ${hh}:${mi}`;
}

/* ---------- KHỞI TẠO ---------- */
async function khoiTao(){
  napPhien();
  await napDanhSach();
}

async function napDanhSach(){
  const r = await sb.from('kiemdinh_dung_cu').select('*')
    .eq('don_vi', DV_TRANG).order('ngay_tao', {ascending:true});
  if (r.error){
    $('trangThai').innerHTML = 'Không tải được danh sách. Thử tải lại trang.';
    return;
  }
  danhSachGoc = r.data || [];

  const ids = danhSachGoc.map(x=>x.id);
  soLanTN = {};
  if (ids.length){
    const r2 = await sb.from('kiemdinh_dung_cu_tn').select('dung_cu_id').in('dung_cu_id', ids);
    if (!r2.error){
      (r2.data||[]).forEach(row=>{ soLanTN[row.dung_cu_id] = (soLanTN[row.dung_cu_id]||0) + 1; });
    }
  }
  loc();
}

/* ---------- LỌC & VẼ BẢNG ---------- */
function loc(){
  const tu = $('oTimKiem').value.trim().toLowerCase();
  let ds = danhSachGoc.filter(x=>{
    if (!tu) return true;
    return [x.ten_dung_cu,x.ma_hieu].some(v=>(v||'').toLowerCase().includes(tu));
  });
  veBang(ds);
}

function veBang(ds){
  $('soLuong').textContent = danhSachGoc.length ? `${ds.length} dụng cụ` : '';
  $('trangThai').style.display = 'none';
  $('khungBang').style.display = '';

  if (!ds.length){
    $('khungBang').style.display = 'none';
    $('trangThai').style.display = '';
    $('trangThai').innerHTML = danhSachGoc.length
      ? '<div class="big">Không tìm thấy</div>Không có dụng cụ nào khớp tìm kiếm.'
      : '<div class="big">Chưa có dụng cụ</div>Bấm “Thêm dụng cụ” để đăng dụng cụ đầu tiên.';
    return;
  }

  const them = coTheThem();
  const xoa = coTheXoa();
  const cols = ['STT','Tên dụng cụ an toàn','Nước SX','Năm SX','Mã hiệu','Thông số kỹ thuật','Số lượng','Định kỳ TN','Lịch sử TN'].concat((them||xoa) ? [''] : []);
  $('hangTieuDe').innerHTML = cols.map(c=>`<th>${c}</th>`).join('');

  $('thanBang').innerHTML = ds.map((x,i)=>{
    const soLan = soLanTN[x.id] || 0;
    let h = `<tr>`;
    h += `<td class="stt">${i+1}</td>`;
    h += `<td class="ten">${esc(x.ten_dung_cu)}</td>`;
    h += `<td>${esc(x.nuoc_sx)||'—'}</td>`;
    h += `<td>${esc(x.nam_sx)||'—'}</td>`;
    h += `<td>${esc(x.ma_hieu)||'—'}</td>`;
    h += `<td class="nd" title="${esc(x.thong_so_ky_thuat)}">${esc(x.thong_so_ky_thuat)||'—'}</td>`;
    h += `<td>${x.so_luong ?? '—'}</td>`;
    h += `<td>${esc(x.dinh_ky_tn)||'—'}</td>`;
    h += `<td><button class="link-btn" data-ls="${x.id}">Lịch sử TN (${soLan})</button></td>`;
    if (them||xoa){
      h += `<td><div class="acts">`;
      if (them) h += `<button class="icon-btn" data-sua="${x.id}" title="Sửa"><svg viewBox="0 0 24 24" fill="none" stroke="#41525d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button>`;
      if (xoa) h += `<button class="icon-btn del" data-xoa="${x.id}" title="Xóa"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2m1 0-1 14a1 1 0 0 1-1 1H8a1 1 0 0 1-1-1L6 6"/></svg></button>`;
      h += `</div></td>`;
    }
    return h + `</tr>`;
  }).join('');

  $('thanBang').querySelectorAll('[data-ls]').forEach(b=>b.onclick=()=>moLS(b.dataset.ls));
  $('thanBang').querySelectorAll('[data-sua]').forEach(b=>b.onclick=()=>ycMoForm(b.dataset.sua));
  $('thanBang').querySelectorAll('[data-xoa]').forEach(b=>b.onclick=()=>ycHoiXoa(b.dataset.xoa));
}

/* ---------- FORM THÊM / SỬA DỤNG CỤ ---------- */
function ycMoForm(id){
  napPhien();
  if (!coTheThem()){ alert('Bạn không có quyền thực hiện thao tác này. Cần đăng nhập đúng vai trò ở tab "Đăng nhập".'); return; }
  moForm(id);
}
function ycHoiXoa(id){
  napPhien();
  if (!coTheXoa()){ alert('Chỉ Kỹ sư an toàn hoặc Quản trị viên mới được xóa dụng cụ.'); return; }
  hoiXoa(id);
}
function moForm(id){
  dangSua = id || null;
  $('loiForm').classList.remove('show');
  $('tieuDeForm').textContent = id ? 'Sửa dụng cụ' : 'Thêm dụng cụ';
  const x = id ? danhSachGoc.find(r=>r.id===id) : {};
  $('f_ten').value = x.ten_dung_cu || '';
  $('f_nuoc_sx').value = x.nuoc_sx || '';
  $('f_nam_sx').value = x.nam_sx || '';
  $('f_ma_hieu').value = x.ma_hieu || '';
  $('f_thong_so').value = x.thong_so_ky_thuat || '';
  $('f_so_luong').value = (x.so_luong ?? '');
  $('f_dinh_ky').value = x.dinh_ky_tn || '';
  $('modalForm').classList.add('show');
  $('f_ten').focus();
}
function dongForm(){ $('modalForm').classList.remove('show'); }

async function luu(){
  napPhien();
  if (!coTheThem()){ dongForm(); return; }
  const ten = $('f_ten').value.trim();
  if (!ten){ baoLoiForm('Vui lòng nhập tên dụng cụ.'); return; }

  const soLuong = $('f_so_luong').value.trim();
  const ban = {
    ten_dung_cu: ten,
    nuoc_sx: $('f_nuoc_sx').value.trim() || null,
    nam_sx: $('f_nam_sx').value.trim() || null,
    ma_hieu: $('f_ma_hieu').value.trim() || null,
    thong_so_ky_thuat: $('f_thong_so').value.trim() || null,
    so_luong: soLuong ? Number(soLuong) : null,
    dinh_ky_tn: $('f_dinh_ky').value.trim() || null,
  };
  if (!dangSua){
    ban.don_vi = DV_TRANG;
    ban.nguoi_tao = phien.ho_ten;
  }

  $('nutLuu').disabled = true; $('nutLuu').textContent = 'Đang lưu…';
  let err;
  if (dangSua){
    ({ error:err } = await sb.from('kiemdinh_dung_cu').update(ban).eq('id', dangSua));
  } else {
    ({ error:err } = await sb.from('kiemdinh_dung_cu').insert(ban));
  }
  $('nutLuu').disabled = false; $('nutLuu').textContent = 'Lưu';

  if (err){
    baoLoiForm('Không lưu được: ' + err.message);
    return;
  }
  dongForm();
  await napDanhSach();
}
function baoLoiForm(m){ const e=$('loiForm'); e.textContent=m; e.classList.add('show'); }

/* ---------- XÓA DỤNG CỤ ---------- */
let idXoa = null;
function hoiXoa(id){
  idXoa = id;
  const x = danhSachGoc.find(r=>r.id===id);
  $('xoaNoiDung').innerHTML = `Xóa dụng cụ <b>${esc(x.ten_dung_cu)}</b>? Toàn bộ lịch sử thử nghiệm của dụng cụ này cũng sẽ bị xóa. Thao tác này không thể hoàn tác.`;
  $('modalXoa').classList.add('show');
}
async function xacNhanXoa(){
  if (!idXoa) return;
  $('nutXacNhanXoa').disabled = true; $('nutXacNhanXoa').textContent = 'Đang xóa…';
  const { error } = await sb.from('kiemdinh_dung_cu').delete().eq('id', idXoa);
  $('nutXacNhanXoa').disabled = false; $('nutXacNhanXoa').textContent = 'Xóa';
  $('modalXoa').classList.remove('show');
  if (error){
    alert('Không xóa được: ' + error.message);
    return;
  }
  idXoa = null;
  await napDanhSach();
}

/* ---------- LỊCH SỬ THỬ NGHIỆM ---------- */
let dungCuLS = null;   // dung cu dang xem lich su
let dsLS = [];
let dangSuaTN = null;

async function moLS(id){
  dungCuLS = danhSachGoc.find(r=>r.id===id);
  if (!dungCuLS) return;
  $('tieuDeLS').textContent = 'Lịch sử thử nghiệm — ' + dungCuLS.ten_dung_cu;
  $('lsSub').textContent = TEN_DON_VI[DV_TRANG] || DV_TRANG;
  $('nutThemTN').style.display = coTheThem() ? '' : 'none';
  dongFormTN();
  $('modalLS').classList.add('show');
  await napLS();
}
function dongLS(){ $('modalLS').classList.remove('show'); dungCuLS = null; }

async function napLS(){
  $('thanLS').innerHTML = `<tr><td colspan="4" class="ls-empty">Đang tải…</td></tr>`;
  const r = await sb.from('kiemdinh_dung_cu_tn').select('*')
    .eq('dung_cu_id', dungCuLS.id).order('ngay_tao', {ascending:true});
  if (r.error){
    $('thanLS').innerHTML = `<tr><td colspan="4" class="ls-empty">Không tải được lịch sử thử nghiệm.</td></tr>`;
    return;
  }
  dsLS = r.data || [];
  veLS();
}

function veLS(){
  const quyen = coTheThem();
  const xoa = coTheXoa();
  if (!dsLS.length){
    $('thanLS').innerHTML = `<tr><td colspan="4" class="ls-empty">Chưa có lần thử nghiệm nào.</td></tr>`;
  } else {
    $('thanLS').innerHTML = dsLS.map(x=>{
      let h = `<tr>`;
      h += `<td>${esc(x.so_bb_ngay)||'—'}</td>`;
      h += `<td>${x.ket_qua ? `<span class="badge ${x.ket_qua}">${TEN_KET_QUA[x.ket_qua]}</span>` : '—'}</td>`;
      h += `<td>${esc(x.ghi_chu)||'—'}</td>`;
      h += `<td><div class="acts">`;
      if (quyen) h += `<button class="icon-btn" data-sua-tn="${x.id}" title="Sửa"><svg viewBox="0 0 24 24" fill="none" stroke="#41525d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button>`;
      if (xoa) h += `<button class="icon-btn del" data-xoa-tn="${x.id}" title="Xóa"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2m1 0-1 14a1 1 0 0 1-1 1H8a1 1 0 0 1-1-1L6 6"/></svg></button>`;
      h += `</div></td>`;
      return h + `</tr>`;
    }).join('');
  }
  $('thanLS').querySelectorAll('[data-sua-tn]').forEach(b=>b.onclick=()=>moFormTN(b.dataset.suaTn));
  $('thanLS').querySelectorAll('[data-xoa-tn]').forEach(b=>b.onclick=()=>ycHoiXoaTN(b.dataset.xoaTn));
}

function moFormTN(id){
  napPhien();
  if (!coTheThem()){ alert('Bạn không có quyền thực hiện thao tác này. Cần đăng nhập đúng vai trò ở tab "Đăng nhập".'); return; }
  dangSuaTN = id || null;
  $('loiLSForm').classList.remove('show');
  const x = id ? dsLS.find(r=>r.id===id) : {};
  $('tn_so_bb').value = x.so_bb_ngay || '';
  $('tn_ket_qua').value = x.ket_qua || 'dat';
  $('tn_ghi_chu').value = x.ghi_chu || '';
  $('lsForm').classList.add('show');
  $('tn_so_bb').focus();
}
function dongFormTN(){ dangSuaTN = null; $('lsForm').classList.remove('show'); }

async function luuTN(){
  napPhien();
  if (!coTheThem()){ dongFormTN(); return; }
  const soBB = $('tn_so_bb').value.trim();
  const ban = {
    so_bb_ngay: soBB || null,
    ket_qua: $('tn_ket_qua').value,
    ghi_chu: $('tn_ghi_chu').value.trim() || null,
  };
  if (!dangSuaTN){
    ban.dung_cu_id = dungCuLS.id;
    ban.nguoi_tao = phien.ho_ten;
  }

  $('nutLuuTN').disabled = true; $('nutLuuTN').textContent = 'Đang lưu…';
  let err;
  if (dangSuaTN){
    ({ error:err } = await sb.from('kiemdinh_dung_cu_tn').update(ban).eq('id', dangSuaTN));
  } else {
    ({ error:err } = await sb.from('kiemdinh_dung_cu_tn').insert(ban));
  }
  $('nutLuuTN').disabled = false; $('nutLuuTN').textContent = 'Lưu';

  if (err){
    const e=$('loiLSForm'); e.textContent='Không lưu được: '+err.message; e.classList.add('show');
    return;
  }
  dongFormTN();
  await napLS();
  await napSoLuongTN();
}

async function napSoLuongTN(){
  const ids = danhSachGoc.map(x=>x.id);
  soLanTN = {};
  if (!ids.length) return;
  const r2 = await sb.from('kiemdinh_dung_cu_tn').select('dung_cu_id').in('dung_cu_id', ids);
  if (!r2.error){
    (r2.data||[]).forEach(row=>{ soLanTN[row.dung_cu_id] = (soLanTN[row.dung_cu_id]||0) + 1; });
  }
  loc();
}

let idXoaTN = null;
function ycHoiXoaTN(id){
  napPhien();
  if (!coTheXoa()){ alert('Chỉ Kỹ sư an toàn hoặc Quản trị viên mới được xóa lần thử nghiệm.'); return; }
  idXoaTN = id;
  $('modalXoaTN').classList.add('show');
}
async function xacNhanXoaTN(){
  if (!idXoaTN) return;
  $('nutXacNhanXoaTN').disabled = true; $('nutXacNhanXoaTN').textContent = 'Đang xóa…';
  const { error } = await sb.from('kiemdinh_dung_cu_tn').delete().eq('id', idXoaTN);
  $('nutXacNhanXoaTN').disabled = false; $('nutXacNhanXoaTN').textContent = 'Xóa';
  $('modalXoaTN').classList.remove('show');
  if (error){
    alert('Không xóa được: ' + error.message);
    return;
  }
  idXoaTN = null;
  await napLS();
  await napSoLuongTN();
}

/* ---------- SỰ KIỆN ---------- */
$('nutThem').onclick = ()=>ycMoForm(null);
$('nutLuu').onclick = luu;
$('nutXacNhanXoa').onclick = xacNhanXoa;
$('oTimKiem').oninput = loc;
$('nutThemTN').onclick = ()=>moFormTN(null);
$('nutHuyTN').onclick = dongFormTN;
$('nutLuuTN').onclick = luuTN;
$('nutXacNhanXoaTN').onclick = xacNhanXoaTN;
document.querySelectorAll('[data-dong]').forEach(b=>b.onclick=dongForm);
document.querySelectorAll('[data-dong-xoa]').forEach(b=>b.onclick=()=>$('modalXoa').classList.remove('show'));
document.querySelectorAll('[data-dong-ls]').forEach(b=>b.onclick=dongLS);
document.querySelectorAll('[data-dong-xoa-tn]').forEach(b=>b.onclick=()=>$('modalXoaTN').classList.remove('show'));
[$('modalForm'),$('modalXoa'),$('modalXoaTN')].forEach(o=>o.onclick=e=>{ if(e.target===o) o.classList.remove('show'); });
$('modalLS').onclick = e=>{ if(e.target===$('modalLS')) dongLS(); };

khoiTao();
</script>
</body>
</html>
